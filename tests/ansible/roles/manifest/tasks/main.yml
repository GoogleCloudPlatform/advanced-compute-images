- name: Block for {{ ansible_role_name }} tasks
  block:
    - name: Check if manifest file exists at the expected destination
      ansible.builtin.stat:
          path: "/usr/share/google/manifest.txt"
      register: manifest_dest_stat
      become: true

    - name: Fail if the manifest file is missing
      ansible.builtin.fail:
          msg: "ERROR: The required license file was not found on the system."
      when: not manifest_dest_stat.stat.exists

    - name: Slurp manifest file content
      ansible.builtin.slurp:
        src: "/usr/share/google/manifest.txt"
      register: manifest_content
      when: manifest_dest_stat.stat.exists

    - name: Decode manifest content
      ansible.builtin.set_fact:
        manifest_text: "{{ manifest_content.content | b64decode }}"
      when: manifest_dest_stat.stat.exists

    - name: Verify key entries in manifest
      ansible.builtin.assert:
        that:
          - "'base_image_name=' in manifest_text"
          - "'base_image_name=NOT FOUND' not in manifest_text"
          - "'google_cloud_cli=' in manifest_text"
        fail_msg: "Manifest content validation failed. Missing key entries."
      when: manifest_dest_stat.stat.exists

    - name: Verify Spack GCC version entry in manifest on Rocky Slurm x86_64
      ansible.builtin.assert:
        that:
          - "('gcc=\"' ~ spack_gcc_version ~ '\"') in manifest_text"
        fail_msg: "Manifest validation failed: expected gcc=\"{{ spack_gcc_version }}\" in manifest."
      when:
        - manifest_dest_stat.stat.exists
        - ansible_facts['os_family'] == 'RedHat'
        - install_slurm | default(false) | bool
        - ansible_facts['architecture'] == 'x86_64'

  rescue:
    - name: Use the failure_recorder role to log this failure
      ansible.builtin.include_role:
        name: common_failure_recorder
