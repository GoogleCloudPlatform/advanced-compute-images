- name: Block for {{ ansible_role_name }} tasks
  block:
    - name: Load Main Common Role Variables
      ansible.builtin.include_vars: "{{ item }}"
      with_first_found:
        - files:
            - "{{ ansible_facts['distribution']|lower }}-{{ ansible_facts['distribution_version'] }}.yml"
            - "{{ ansible_facts['distribution']|lower }}-{{ ansible_facts['distribution_major_version'] }}.yml"
            - "{{ ansible_facts['distribution']|lower }}.yml"
            - "{{ ansible_facts['os_family']|lower }}-{{ ansible_facts['distribution_version'] }}.yml"
            - "{{ ansible_facts['os_family']|lower }}-{{ ansible_facts['distribution_major_version'] }}.yml"
            - "{{ ansible_facts['os_family']|lower }}.yml"
          paths:
            - "{{ playbook_dir }}/../../ansible/roles/common/vars"
      ignore_errors: true

    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Verify common packages are installed
      ansible.builtin.assert:
        that:
          - "item in ansible_facts.packages"
        fail_msg: "Required common package {{ item }} is not installed."
      loop: "{{ common_packages | default([]) }}"

    - name: Check if /etc/profile.d/00-local.sh exists
      ansible.builtin.stat:
        path: /etc/profile.d/00-local.sh
      register: local_profile_stat

    - name: Assert /etc/profile.d/00-local.sh exists
      ansible.builtin.assert:
        that: "local_profile_stat.stat.exists"
        fail_msg: "/etc/profile.d/00-local.sh does not exist."

    - name: Check if /etc/ld.so.conf.d/usr-local.conf exists
      ansible.builtin.stat:
        path: /etc/ld.so.conf.d/usr-local.conf
      register: ld_conf_stat

    - name: Assert /etc/ld.so.conf.d/usr-local.conf exists
      ansible.builtin.assert:
        that: "ld_conf_stat.stat.exists"
        fail_msg: "/etc/ld.so.conf.d/usr-local.conf does not exist."

    - name: Check if firstrun flag exists
      ansible.builtin.stat:
        path: /.google_hpc_firstrun
      register: firstrun_stat

    - name: Assert firstrun flag exists on Debian/Ubuntu (since it remains after boot)
      ansible.builtin.assert:
        that:
          - "firstrun_stat.stat.exists"
          - "firstrun_stat.stat.mode == '0660'"
        fail_msg: "Firstrun flag verification failed on Debian/Ubuntu (exists or mode incorrect)."
      when: ansible_facts['os_family'] == "Debian"

    - name: Assert firstrun flag does not exist on RedHat/Rocky (since it should be consumed on first boot)
      ansible.builtin.assert:
        that:
          - "not firstrun_stat.stat.exists"
        fail_msg: "Firstrun flag still exists on RedHat/Rocky VM, indicating first-boot tuning failed to execute or clean up."
      when: ansible_facts['os_family'] == "RedHat"

    # Self-contained toolchain checks. These deliberately do not rely on
    # common_packages above: that list is loaded from a path outside the test
    # bundle and is silently skipped in CI. Slurm-GCP >= 6.12.2 uninstalls
    # scl-utils by default, which also removes gcc-toolset-* and clang
    # (clang-libs requires gcc-toolset-15-gcc-c++).
    - name: Define required RedHat toolchain packages
      ansible.builtin.set_fact:
        required_toolchain_packages: >-
          {{ ['scl-utils', 'gcc-toolset-12-gcc', 'gcc-toolset-12-gcc-c++']
             + (['gcc-toolset-15-gcc', 'clang'] if (el9_slurm | bool) else []) }}
      vars:
        el9_slurm: "{{ (install_slurm | default(false) | bool) and ansible_facts['distribution_major_version'] == '9' }}"
      when: ansible_facts['os_family'] == "RedHat"

    - name: Verify RedHat toolchain packages are installed
      ansible.builtin.assert:
        that:
          - "item in ansible_facts.packages"
        fail_msg: "Required toolchain package {{ item }} is not installed."
      loop: "{{ required_toolchain_packages | default([]) }}"
      when: ansible_facts['os_family'] == "RedHat"

    - name: Verify gcc-toolset compilers are usable
      ansible.builtin.shell: |
        set -o pipefail
        source /opt/rh/gcc-toolset-{{ item }}/enable
        gcc -dumpversion | cut -d. -f1
      args:
        executable: /bin/bash
      register: gcc_toolset_version
      changed_when: false
      failed_when: gcc_toolset_version.rc != 0 or (gcc_toolset_version.stdout | trim) != (item | string)
      loop: "{{ [12, 15] if ((install_slurm | default(false) | bool) and ansible_facts['distribution_major_version'] == '9') else [12] }}"
      when: ansible_facts['os_family'] == "RedHat"

    - name: Verify clang is usable
      ansible.builtin.command: clang --version
      register: clang_version
      changed_when: false
      when:
        - ansible_facts['os_family'] == "RedHat"
        - ansible_facts['distribution_major_version'] == '9'
        - install_slurm | default(false) | bool

    # Ensure Rocky 8 and Rocky 9 images preserve legacy eth0 naming and the
    # net.ifnames=0 / biosdevname=0 kernel boot parameters. Slurm-GCP's
    # cgroups/grub_cmdline role can overwrite GRUB_CMDLINE_LINUX="" when
    # cgroup_grub_cmdline_linux is empty, stripping these flags from Rocky 8
    # BLS $kernelopts (resulting in ens*/enx* interface names).
    - name: Verify RedHat kernel cmdline and eth0 network interface naming
      when:
        - ansible_facts['os_family'] == "RedHat"
        - ansible_facts['distribution_major_version'] in ['8', '9']
      block:
        - name: Read /proc/cmdline
          ansible.builtin.slurp:
            src: /proc/cmdline
          register: proc_cmdline_raw

        - name: Parse /proc/cmdline tokens
          ansible.builtin.set_fact:
            proc_cmdline_tokens: "{{ (proc_cmdline_raw.content | b64decode).split() }}"

        - name: Assert net.ifnames=0 and biosdevname=0 are present in /proc/cmdline
          ansible.builtin.assert:
            that:
              - "'net.ifnames=0' in proc_cmdline_tokens"
              - "'biosdevname=0' in proc_cmdline_tokens"
            fail_msg: >-
              Expected 'net.ifnames=0' and 'biosdevname=0' in /proc/cmdline,
              got: {{ proc_cmdline_raw.content | b64decode | trim }}

        - name: Assert primary network interface is named eth0
          ansible.builtin.assert:
            that:
              - "ansible_facts['default_ipv4']['interface'] is defined"
              - "ansible_facts['default_ipv4']['interface'] == 'eth0'"
            fail_msg: >-
              Expected primary network interface 'eth0',
              got '{{ ansible_facts['default_ipv4']['interface'] | default('undefined') }}'
              (interfaces: {{ ansible_facts['interfaces'] | default([]) }}).

    # Verify Ansible build virtualenv and CLI symlink presence.
    # On Rocky 8, /opt/ansible-venv and /usr/bin/ansible* symlinks must be removed
    # during image cleanup to prevent Python 3.6 / 3.12 conflicts with Cluster
    # Toolkit. On all other OS distributions (e.g. Rocky 9, Ubuntu), Ansible
    # must remain pre-installed in /opt/ansible-venv with CLI symlinks in /usr/bin.
    - name: Verify Ansible build venv and symlink state
      block:
        - name: Check if /opt/ansible-venv exists
          ansible.builtin.stat:
            path: /opt/ansible-venv
          register: opt_ansible_venv_stat

        - name: Check if /usr/bin/ansible-playbook exists
          ansible.builtin.stat:
            path: /usr/bin/ansible-playbook
          register: usr_bin_ansible_playbook_stat

        - name: Check if pre-boot image Ansible state was recorded
          ansible.builtin.stat:
            path: /run/image-ansible-state.json
          register: preboot_ansible_state_stat

        - name: Read pre-boot image Ansible state if recorded
          ansible.builtin.slurp:
            src: /run/image-ansible-state.json
          register: preboot_ansible_state_raw
          when: preboot_ansible_state_stat.stat.exists

        - name: Parse pre-boot image Ansible state
          ansible.builtin.set_fact:
            preboot_ansible_state: "{{ preboot_ansible_state_raw.content | b64decode | from_json }}"
          when: preboot_ansible_state_stat.stat.exists

        - name: Assert Ansible build venv and symlinks are absent on Rocky 8
          ansible.builtin.assert:
            that:
              - not opt_ansible_venv_stat.stat.exists
              - not usr_bin_ansible_playbook_stat.stat.exists
              - preboot_ansible_state is not defined or not preboot_ansible_state.ansible_venv_present
              - preboot_ansible_state is not defined or not preboot_ansible_state.ansible_symlink_present
            fail_msg: >-
              Expected /opt/ansible-venv and /usr/bin/ansible-playbook to be removed on Rocky 8
              during cleanup, but found preboot venv={{ preboot_ansible_state.ansible_venv_present | default('N/A') }},
              preboot symlink={{ preboot_ansible_state.ansible_symlink_present | default('N/A') }},
              current /opt/ansible-venv exists={{ opt_ansible_venv_stat.stat.exists }},
              current /usr/bin/ansible-playbook exists={{ usr_bin_ansible_playbook_stat.stat.exists }}.
          when:
            - ansible_facts['distribution'] | lower == 'rocky'
            - ansible_facts['distribution_major_version'] == '8'

        - name: Assert Ansible build venv and symlinks are present on non-Rocky-8 images
          ansible.builtin.assert:
            that:
              - opt_ansible_venv_stat.stat.exists
              - usr_bin_ansible_playbook_stat.stat.exists
              - preboot_ansible_state is not defined or preboot_ansible_state.ansible_venv_present
              - preboot_ansible_state is not defined or preboot_ansible_state.ansible_symlink_present
            fail_msg: >-
              Expected /opt/ansible-venv and /usr/bin/ansible-playbook to be pre-installed on
              {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_major_version'] }} image,
              but found preboot venv={{ preboot_ansible_state.ansible_venv_present | default('N/A') }},
              preboot symlink={{ preboot_ansible_state.ansible_symlink_present | default('N/A') }},
              current /opt/ansible-venv exists={{ opt_ansible_venv_stat.stat.exists }},
              current /usr/bin/ansible-playbook exists={{ usr_bin_ansible_playbook_stat.stat.exists }}.
          when: not (ansible_facts['distribution'] | lower == 'rocky' and ansible_facts['distribution_major_version'] == '8')

    - name: Verify kernel matches BaseOS and kernel-devel is pinned to it on RedHat/Rocky
      ansible.builtin.shell: |
        set -e
        running="$(uname -r)"
        cores="$(rpm -q kernel-core --qf '%{VERSION}-%{RELEASE}.%{ARCH}\n' | sort -u)"
        echo "running=${running}"; echo "kernel-core installed:"; echo "${cores}"
        if [ "$(echo "${cores}" | wc -l)" -ne 1 ]; then echo "more than one kernel-core installed" && exit 1; fi
        if [ "${cores}" != "${running}" ]; then echo "installed kernel-core does not match running kernel" && exit 1; fi
        rpm -q "kernel-devel-${running}" >/dev/null || { echo "kernel-devel-${running} not installed" && exit 1; }
        if rpm -q kernel-devel --qf '%{VERSION}-%{RELEASE}.%{ARCH}\n' | grep -v -x "${running}" | grep -q .; then
          echo "kernel-devel for a different kernel is installed" && exit 1
        fi
        headers="$(rpm -q kernel-headers --qf '%{VERSION}-%{RELEASE}.%{ARCH}\n')"
        echo "kernel-headers=${headers}"
        if [ "${headers}" != "${running}" ]; then echo "kernel-headers does not match running kernel" && exit 1; fi
      changed_when: false
      when: ansible_facts['os_family'] == "RedHat"

  rescue:
    - name: Use the failure_recorder role to log this failure
      ansible.builtin.include_role:
        name: common_failure_recorder
