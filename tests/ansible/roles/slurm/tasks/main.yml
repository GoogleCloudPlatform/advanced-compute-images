- name: Block for {{ ansible_role_name }} tasks
  block:
  - name: Configure and Verify Single-Node Slurm
    ansible.builtin.shell: |
      set -e
      ANSIBLE_HOSTNAME=$(hostname -s)

      # 1. Configure Munge
      echo "--- Configuring Munge ---"
      if [ ! -f /etc/munge/munge.key ]; then
        dd if=/dev/urandom of=/etc/munge/munge.key bs=1024 count=1
      fi
      sudo chown munge:munge /etc/munge/munge.key
      sudo chmod 0400 /etc/munge/munge.key
      sudo systemctl enable --now munge
      munge -n | unmunge
      sudo systemctl status munge

      # 2. Configure Slurm
      echo "--- Configuring Slurm ---"
      sudo bash -c "cat > /etc/slurm/slurm.conf <<EOF
      ClusterName=mycluster
      SlurmctldHost=${ANSIBLE_HOSTNAME}
      MpiDefault=none
      ProctrackType=proctrack/cgroup
      ReturnToService=1
      SlurmctldPort=6817
      SlurmctldTimeout=300
      SlurmdPort=6818
      SlurmdSpoolDir=/var/spool/slurmd
      SlurmdTimeout=300
      SlurmUser=slurm
      StateSaveLocation=/var/spool/slurmctld
      SwitchType=switch/none
      TaskPlugin=task/affinity,task/cgroup
      NodeName=${ANSIBLE_HOSTNAME} Procs=1 State=UNKNOWN
      PartitionName=debug Nodes=${ANSIBLE_HOSTNAME} Default=YES MaxTime=INFINITE State=UP
      EOF"

      # Create cgroup.conf (often needed)
      sudo bash -c "cat > /etc/slurm/cgroup.conf <<EOF
      CgroupAutomount=yes
      CgroupMountpoint=/sys/fs/cgroup
      ConstrainCores=yes
      ConstrainRAMSpace=yes
      ConstrainSwapSpace=yes
      EOF"

      # 3. Create Directories
      sudo mkdir -p /var/spool/slurmctld /var/spool/slurmd /var/log/slurm
      sudo chown slurm:slurm /var/spool/slurmctld /var/spool/slurmd /var/log/slurm
      sudo chmod 755 /var/spool/slurmctld /var/spool/slurmd
      sudo chmod 755 /var/log/slurm

      # 4. Start Slurm Services
      echo "--- Starting Slurm Services ---"
      sudo systemctl enable --now slurmctld
      sudo systemctl enable --now slurmd

    changed_when: false
    become: yes

  - name: Verify Slurm Services are Running
    ansible.builtin.shell: |
      set -e
      echo "--- Verifying Slurm Services ---"
      # Ensure Slurm services are active
      if systemctl is-active --quiet slurmctld; then
        echo "slurmctld service is running."
      else
        echo "ERROR: slurmctld service is not running."
        exit 1
      fi
      if systemctl is-active --quiet slurmd; then
        echo "slurmd service is running."
      else
        echo "ERROR: slurmd service is not running."
        exit 1
      fi
    changed_when: false
    become: yes

  - name: Test Pyxis Installation
    ansible.builtin.shell: |
      set -e
      echo "--- Verifying Pyxis Installation ---"
      if [ -x "/usr/local/bin/enroot" ]; then
        echo "Pyxis (enroot) is installed at /usr/local/bin/enroot."
      else
        echo "ERROR: Pyxis (enroot) not found at /usr/local/bin/enroot."
        exit 1
      fi
    changed_when: false

  - name: Test Slurm Functionality with sinfo
    ansible.builtin.shell: |
      set -e
      SINFO_OUTPUT=$(sinfo)
      SINFO_RC=$?

      if [ "$SINFO_RC" -ne 0 ]; then
        echo "ERROR: sinfo command failed with exit code $SINFO_RC"
        exit 1
      fi

      if [ -n "$SINFO_OUTPUT" ]; then
        echo "sinfo ran successfully. Output:"
        echo "$SINFO_OUTPUT"
      else
        echo "ERROR: sinfo output is empty."
        exit 1
      fi
    changed_when: false
    become: yes

  rescue:
  - name: Use the failure_recorder role to log this failure
    ansible.builtin.include_role:
      name: common_failure_recorder
