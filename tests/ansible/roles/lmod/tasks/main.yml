- name: Block for {{ ansible_role_name }} tasks
  block:
  - name: "Lmod | Test | Check if Lmod is installed via Spack"
    become: true
    become_user: "{{ hpc_user }}"
    ansible.builtin.shell:
      cmd: |
        . {{ spack_root }}/share/spack/setup-env.sh
        spack find lmod
      executable: /bin/bash
    register: lmod_find_check
    changed_when: false
    failed_when: "'lmod' not in lmod_find_check.stdout"

  - name: "Lmod | Test | Check if profile script exists"
    ansible.builtin.stat:
      path: /etc/profile.d/z00_spack_lmod.sh
    register: profile_script

  - name: "Lmod | Test | Fail if profile script does not exist"
    ansible.builtin.fail:
      msg: "The Lmod profile script /etc/profile.d/z00_spack_lmod.sh was not created."
    when: "not profile_script.stat.exists"

  - name: "Lmod | Test | Check if module command is available"
    ansible.builtin.shell:
      cmd: |
        . /etc/profile.d/z00_spack_lmod.sh
        module --version
      executable: /bin/bash
    register: module_command_check
    changed_when: false
    failed_when: "module_command_check.rc != 0"

  rescue:
  - name: Use the failure_recorder role to log this failure
    ansible.builtin.include_role:
      name: common_failure_recorder