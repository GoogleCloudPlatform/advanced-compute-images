- name: Block for {{ ansible_role_name }} tasks
  block:
  - name: Check if gcloud CLI is working as expected
    ansible.builtin.shell: |
      #!/bin/bash
      echo "Checking gcloud command available in path."
      gcloud_command_output=""
      if command -v gcloud &> /dev/null; then
        echo "SUCCESS: 'gcloud' command found in path."
      else
        exit_code=$?
        echo "FAILURE: 'gcloud' failed with exit code ${exit_code}."
        exit 1
      fi
    register: gcloud_check
    changed_when: false # This task doesn't change system state
    failed_when: gcloud_check.rc != 0

  rescue:
  - name: Use the failure_recorder role to log this failure
    ansible.builtin.include_role:
      name: common_failure_recorder