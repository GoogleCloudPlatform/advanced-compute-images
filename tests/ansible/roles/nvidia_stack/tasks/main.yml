- name: Block for {{ ansible_role_name }} tasks
  block:
  - name: Check for NVIDIA GPU existence via lspci
    ansible.builtin.shell: "lspci | grep -i nvidia"
    register: lspci_nvidia
    changed_when: false
    failed_when: false
    when: ansible_facts['architecture'] in ['aarch64', 'arm64']

  - name: Set gpu_present fact
    ansible.builtin.set_fact:
      gpu_present: "{{ lspci_nvidia.rc == 0 if 'rc' in lspci_nvidia else false }}"
  - name: Test CUDA installation
    ansible.builtin.shell:
      cmd: "/usr/local/cuda/bin/nvcc --version"
    register: nvcc_output
    changed_when: false
    failed_when: nvcc_output.rc != 0 or not (nvcc_output.stdout | regex_search('Cuda compilation tools'))

  - name: Test NVIDIA Driver Installation
    ansible.builtin.shell:
      cmd: "nvidia-smi"
    register: nvidia_smi_output
    changed_when: false
    failed_when: nvidia_smi_output.rc != 0
    when: gpu_present
  - name: Display nvidia-smi output
    ansible.builtin.debug:
      var: nvidia_smi_output.stdout_lines
    when: gpu_present
  - name: Test NVIDIA CUDA Toolkit (nvcc)
    ansible.builtin.shell:
      cmd: "/usr/local/cuda/bin/nvcc --version"
    register: nvcc_output
    changed_when: false
    failed_when: nvcc_output.rc != 0 or not (nvcc_output.stdout | regex_search('Cuda compilation tools'))

  - name: Display nvcc version output
    ansible.builtin.debug:
      var: nvcc_output.stdout_lines

  - name: Check Fabric Manager Service Status
    ansible.builtin.shell:
      cmd: "systemctl is-active nvidia-fabricmanager.service"
    register: fm_status
    changed_when: false
    failed_when: false
    ignore_errors: true

  - name: Display Fabric Manager service status
    ansible.builtin.debug:
      msg: "Fabric Manager service status is: {{ fm_status.stdout | default('inactive') }}"

  - name: Test NVIDIA Container Toolkit - Check CLI version
    ansible.builtin.command:
      cmd: "nvidia-ctk --version"
    register: nct_version_output
    changed_when: false
    failed_when: nct_version_output.rc != 0

  - name: Display NVIDIA Container Toolkit version
    ansible.builtin.debug:
      var: nct_version_output.stdout_lines

  - name: "Verify status of nvidia-persistenced.service"
    ansible.builtin.shell:
      cmd: "systemctl is-enabled nvidia-persistenced.service"
    register: persistenced_status
    changed_when: false
    failed_when: persistenced_status.stdout == 'enabled'

  - name: Display nvidia-persistenced.service status
    ansible.builtin.debug:
      msg: "nvidia-persistenced.service status: {{ persistenced_status.stdout }}"

  - name: Verify NVIDIA DCGM service and hang detection configuration
    block:
      - name: "Verify status of nvidia-dcgm.service"
        ansible.builtin.shell:
          cmd: "systemctl is-enabled nvidia-dcgm.service"
        register: dcgm_status
        changed_when: false
        failed_when: dcgm_status.stdout == 'enabled'
        when: ansible_facts['os_family'] == "Debian"

      - name: Display nvidia-dcgm.service status
        ansible.builtin.debug:
          msg: "nvidia-dcgm.service status: {{ dcgm_status.stdout }}"
        when: ansible_facts['os_family'] == "Debian"

      - name: Check if nvidia-dcgm.service exists for hang detection test
        ansible.builtin.stat:
          path: /lib/systemd/system/nvidia-dcgm.service
        register: test_dcgm_service_file

      - name: "Verify DCGM hang detection is disabled in nvidia-dcgm.service"
        ansible.builtin.shell:
          cmd: "grep 'DCGM_HANGDETECT_DISABLE=1' /lib/systemd/system/nvidia-dcgm.service"
        register: dcgm_hangdetect_check
        changed_when: false
        failed_when: dcgm_hangdetect_check.rc != 0
        when: test_dcgm_service_file.stat.exists
    when: install_dcgm | default(false) | bool

  - name: Test NVIDIA DOCA installation (check for ofed)
    ansible.builtin.shell:
      cmd: >-
        {% if ansible_facts['os_family'] == "Debian" %}
        dpkg -l | grep doca-ofed
        {% elif ansible_facts['os_family'] == "RedHat" %}
        rpm -qa | grep doca-ofed
        {% endif %}
    register: doca_check
    changed_when: false
    failed_when: doca_check.rc != 0
    when: install_doca | default(false)

  - name: Test NVIDIA DCGM installation (check dcgmi version)
    ansible.builtin.shell:
      cmd: "dcgmi --version"
    register: dcgm_version
    changed_when: false
    failed_when: dcgm_version.rc != 0
    when: install_dcgm | default(false) | bool


  rescue:
  - name: Use the failure_recorder role to log this failure
    ansible.builtin.include_role:
      name: common_failure_recorder


