- name: Block for {{ ansible_role_name }} tasks
  block:
  - name: "VERIFY | OpenMPI is installed via Spack"
    become: true
    become_user: "{{ hpc_user }}"
    ansible.builtin.shell: |
      . {{ spack_root }}/share/spack/setup-env.sh
      spack find openmpi@{{ ompi_version }}
    args:
      executable: /bin/bash
    register: spack_find_ompi
    changed_when: false
    failed_when: "'openmpi@{{ ompi_version }}' not in spack_find_ompi.stdout"
    tags:
      - tests
      - spack
      - ompi

  - name: "VERIFY | OpenMPI View has mpirun executable"
    ansible.builtin.stat:
      path: "{{ ompi_view_path }}/bin/mpirun"
    register: ompi_view_mpirun
    tags:
      - tests
      - view
      - ompi

  - name: "VERIFY | Spack module for OpenMPI can be loaded"
    become: true
    become_user: "{{ hpc_user }}"
    ansible.builtin.shell: |
      . {{ spack_root }}/share/spack/setup-env.sh
      . /etc/profile.d/z00_spack_lmod.sh
      module load openmpi
    args:
      executable: /bin/bash
    register: module_load_check
    changed_when: false
    failed_when: module_load_check.rc != 0
    tags:
      - tests
      - module
      - ompi

  - name: "VERIFY | ompi_info command"
    become: true
    become_user: "{{ hpc_user }}"
    ansible.builtin.shell: |
      . {{ spack_root }}/share/spack/setup-env.sh
      . /etc/profile.d/z00_spack_lmod.sh
      module load openmpi
      ompi_info
    args:
      executable: /bin/bash
    register: ompi_info_check
    changed_when: false
    failed_when: ompi_info_check.stdout | length == 0
    tags:
      - tests
      - module
      - ompi

  rescue:
  - name: Use the failure_recorder role to log this failure
    ansible.builtin.include_role:
      name: common_failure_recorder