- name: Block for {{ ansible_role_name }} tasks
  block:
  - name: Check if GCS Fuse is working as expected
    ansible.builtin.shell: |
      #!/bin/bash
      if command -v gcsfuse &> /dev/null; then
        echo "gcsfuse is installed."
        # Display the installed version
        gcsfuse --version
        exit 0
      else
        echo "gcsfuse is not installed or not found in the system's PATH."
        echo "Please refer to the official documentation for installation instructions: https://cloud.google.com/storage/docs/cloud-storage-fuse/install"
        exit 1
      fi
    register: gcsfuse_check
    changed_when: false # This task doesn't change system state
    failed_when: gcsfuse_check.rc != 0

  rescue:
  - name: Use the failure_recorder role to log this failure
    ansible.builtin.include_role:
      name: common_failure_recorder