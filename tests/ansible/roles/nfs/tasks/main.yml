- name: Block for {{ ansible_role_name }} tasks
  block:
  - name: Verify NFS Packages Installed
    ansible.builtin.shell: |
      set -e
      if command -v dpkg-query &> /dev/null; then
        dpkg-query -W -f='${Status}' nfs-kernel-server 2>/dev/null | grep -q "ok installed"
      elif command -v rpm &> /dev/null; then
        rpm -q nfs-utils &> /dev/null
      else
        echo "Unknown package manager"
        exit 1
      fi
    changed_when: false

  - name: Verify NFS Configuration for RPCNFSDCOUNT
    ansible.builtin.shell: |
      set -e
      if [ -f /etc/default/nfs-kernel-server ]; then
        grep -E "^RPCNFSDCOUNT={{ nfs_threads }}" /etc/default/nfs-kernel-server
      elif [ -f /etc/nfs.conf ]; then
        grep -E "^\s*threads\s*=\s*{{ nfs_threads }}" /etc/nfs.conf
      else
        echo "NFS configuration file not found"
        exit 1
      fi
    changed_when: false

  - name: Verify NFS systemd Service Enabled
    ansible.builtin.shell: |
      set -e
      systemctl is-enabled nfs-server
    changed_when: false

  - name: Functional Test - Local NFS Export and Mount
    ansible.builtin.shell: |
      set -e
      EXPORT_DIR=$(mktemp -d /tmp/nfs_test_export.XXXXXX)
      MOUNT_DIR=$(mktemp -d /tmp/nfs_test_mount.XXXXXX)

      cleanup() {
        umount -f "$MOUNT_DIR" 2>/dev/null || true
        rm -rf "$EXPORT_DIR" "$MOUNT_DIR"
        sed -i "\#$EXPORT_DIR#d" /etc/exports 2>/dev/null || true
        exportfs -r 2>/dev/null || true
      }
      trap cleanup EXIT

      echo "$EXPORT_DIR 127.0.0.1(rw,no_subtree_check,no_root_squash)" >> /etc/exports
      systemctl restart nfs-server
      exportfs -r

      mount -t nfs 127.0.0.1:"$EXPORT_DIR" "$MOUNT_DIR"

      TEST_FILE="$MOUNT_DIR/test_write.txt"
      echo "NFS functional test payload" > "$TEST_FILE"
      grep -q "NFS functional test payload" "$EXPORT_DIR/test_write.txt"

      echo "SUCCESS: NFS functional export and mount test passed."
    changed_when: false
    become: yes

  rescue:
  - name: Use the failure_recorder role to log this failure
    ansible.builtin.include_role:
      name: common_failure_recorder
