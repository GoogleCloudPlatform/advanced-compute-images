- name: Block for {{ ansible_role_name }} tasks
  block:
  - name: "Spack | Test | Check if python venv exists"
    ansible.builtin.stat:
      path: /opt/spack-venv
    register: venv_dir

  - name: "Spack | Test | Fail if python venv does not exist"
    ansible.builtin.fail:
      msg: "The python venv for spack was not created at /opt/spack-venv"
    when: "not venv_dir.stat.exists or not venv_dir.stat.isdir"

  - name: "Spack | Test | Check if google-cloud-storage is installed"
    ansible.builtin.command: /opt/spack-venv/bin/pip show google-cloud-storage
    register: pip_show_gcs
    changed_when: false

  - name: "Spack | Test | Fail if google-cloud-storage is not installed"
    ansible.builtin.fail:
      msg: "google-cloud-storage is not installed in the spack venv"
    when: "pip_show_gcs.rc != 0"

  - name: "Spack | Test | Check if HPC user exists"
    ansible.builtin.command: "id -u {{ hpc_user }}"
    register: hpc_user_check
    changed_when: false
    failed_when: "hpc_user_check.rc != 0"

  - name: "Spack | Test | Check if Spack directory exists"
    ansible.builtin.stat:
      path: "{{ spack_root }}"
    register: spack_dir

  - name: "Spack | Test | Fail if Spack directory does not exist"
    ansible.builtin.fail:
      msg: "Spack directory {{ spack_root }} does not exist."
    when: "not spack_dir.stat.exists or not spack_dir.stat.isdir"

  - name: "Spack | Test | Check if spack command is available"
    become: true
    become_user: "{{ hpc_user }}"
    ansible.builtin.shell:
      cmd: |
        . {{ spack_root }}/share/spack/setup-env.sh
        spack --version
      executable: /bin/bash
    register: spack_version_check
    changed_when: false

  - name: "Spack | Test | Check if spack version is correct"
    ansible.builtin.assert:
      that:
        - "spack_version.split('/')[-1][1:] == (spack_version_check.stdout.split('.')[:2] | join('.'))"

  - name: "Spack | Test | Check if spack mirror is configured"
    become: true
    become_user: "{{ hpc_user }}"
    ansible.builtin.shell:
      cmd: |
        . {{ spack_root }}/share/spack/setup-env.sh
        spack mirror list | grep -q "google_spack_cache"
      executable: /bin/bash
    changed_when: false

  - name: "Spack | Test | Check if spack compilers are found"
    become: true
    become_user: "{{ hpc_user }}"
    ansible.builtin.shell:
      cmd: |
        . {{ spack_root }}/share/spack/setup-env.sh
        spack compiler list
      executable: /bin/bash
    register: spack_compiler_list
    changed_when: false

  - name: "Spack | Test | Fail if no compilers are found"
    ansible.builtin.fail:
      msg: "No compilers found by Spack."
    when: "'No compilers' in spack_compiler_list.stdout"

  rescue:
  - name: Use the failure_recorder role to log this failure
    ansible.builtin.include_role:
      name: common_failure_recorder
