- name: Record failure in role {{ ansible_role_name }}
  ansible.builtin.set_fact:
    # Append to the global list, delegating to localhost
    global_failed_tasks: "{{ global_failed_tasks | default([]) + \
                            [{'role': ansible_role_name,
                              'task': ansible_failed_task.get('name', 'Unknown Task'),
                              'module': ansible_failed_task.get('action', 'Unknown Module'),
                              'msg': ansible_failed_result.get('msg', 'No specific error message'),
                              'stderr': ansible_failed_result.get('stderr', 'N/A') }] }}"
  delegate_to: localhost
  run_once: true # Ensures set_fact runs once per failure event on localhost

- name: Debug caught error in {{ ansible_role_name }}
  ansible.builtin.debug:
    msg: "Caught an error in role '{{ ansible_role_name }}'. Continuing..."