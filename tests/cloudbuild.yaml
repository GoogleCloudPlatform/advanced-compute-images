# Example test-cloudbuild.yaml
# This is roughly similar in structure to the build file, except its used to test
# To run this build:
# gcloud builds submit --config tests/cloudbuild.yaml --project YOUR_PROJECT_ID
# Ensure this is run from the root directory
#
# You can override substitutions via the command line, for example to test for a particular image:
# gcloud builds submit --config tests/cloudbuild.yaml --project YOUR_PROJECT_ID --substitutions=_CONFIG_FILE="rocky-9-cpu.pkrvars.hcl",_OVERRIDES="source_image=gpu-ubuntu2204-12-8-0-570-dev-1"

substitutions:
  _CONFIG_FILE: "ubuntu-2204-slurm-gpu-dev.pkrvars.hcl"
  _BUILD_NUMBER: "7"
  _RELEASE_TRACK: "dev"
  _ZONE: "us-central1-a"
  _OVERRIDES: ""
  _TEST_RESULTS_GCS_PATH: ""

steps:
- name: 'gcr.io/google.com/cloudsdktool/google-cloud-cli:slim'
  entrypoint: 'bash'
  env:
    - 'PACKER_LOG=1'
  args:
    - '-c'
    - |
      set -e

      # --- Install Dependencies ---
      # We only need Packer now. Ansible runs inside the VM and comes installed with the image
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y curl unzip

      # --- Install Packer ---
      echo "Installing Packer..."
      PACKER_VERSION="1.11.2"
      curl -LO "https://releases.hashicorp.com/packer/$${PACKER_VERSION}/packer_$${PACKER_VERSION}_linux_amd64.zip"
      unzip -j -o "packer_$${PACKER_VERSION}_linux_amd64.zip" packer -d /usr/bin
      chmod +x /usr/bin/packer
      rm "packer_$${PACKER_VERSION}_linux_amd64.zip"

      packer --version

      # --- Prepare Ansible Bundle ---
      echo "Bundling and encoding Ansible directory..."
      tar -czf test_bundle.tar.gz -C tests/ansible .
      TEST_BUNDLE_B64=$(base64 -w 0 test_bundle.tar.gz)
      rm test_bundle.tar.gz

      # --- Prepare Packer Arguments ---
      declare -a PACKER_ARGS
      PACKER_ARGS=(-var-file="packer/builds/${_CONFIG_FILE}")
      PACKER_ARGS+=(-var="project_id=${PROJECT_ID}")
      PACKER_ARGS+=(-var="build_number=${_BUILD_NUMBER}")
      PACKER_ARGS+=(-var="build_id=${BUILD_ID}")
      PACKER_ARGS+=(-var="release_track=${_RELEASE_TRACK}")
      PACKER_ARGS+=(-var="test_bundle_base64=$$TEST_BUNDLE_B64")
      PACKER_ARGS+=(-var="test_results_gcs_path=${_TEST_RESULTS_GCS_PATH}")
      PACKER_ARGS+=(-var="zone=${_ZONE}")

      # Process any overrides passed from the command line
      if [[ -n "${_OVERRIDES}" ]]; then
        echo "Processing overrides from _OVERRIDES: ${_OVERRIDES}"
        IFS=';' read -ra OVERRIDE_PAIRS <<< "${_OVERRIDES}"

        for pair in "$${OVERRIDE_PAIRS[@]}"; do
          if [[ -n "$${pair}" ]]; then
            PACKER_ARGS+=(-var="$${pair}")
          fi
        done
      fi

      # --- Resolve Source Image ---
      echo "Initializing Packer and resolving image family..."
      packer init tests/packer/

      IMAGE_FAMILY=$(echo 'local.image_family_name' | packer console "$${PACKER_ARGS[@]}" tests/packer/ | tr -d '\r')
      echo "Image family is: $$IMAGE_FAMILY"

      SOURCE_IMAGE=""
      if [[ "${_OVERRIDES}" =~ source_image=([^;]+) ]]; then
        SOURCE_IMAGE="$${BASH_REMATCH[1]}"
        echo "Using source_image from _OVERRIDES: $$SOURCE_IMAGE"
      else
        echo "Querying latest created image (including deprecated) for family $$IMAGE_FAMILY..."
        SOURCE_IMAGE=$(gcloud compute images list \
          --project="${PROJECT_ID}" \
          --show-deprecated \
          --no-standard-images \
          --filter="family=$${IMAGE_FAMILY}" \
          --sort-by="~creationTimestamp" \
          --limit=1 \
          --format="value(name)" 2>/dev/null || true)
        if [ -n "$$SOURCE_IMAGE" ]; then
          echo "Selected latest image to test: $$SOURCE_IMAGE"
          PACKER_ARGS+=(-var="source_image=$$SOURCE_IMAGE")
        fi
      fi

      PACKER_ARGS+=(tests/packer/)

      # --- Build the Test Image ---
      echo "Starting Packer test build in zone: ${_ZONE}..."
      echo "Arguments: $${PACKER_ARGS[@]}"

      status=0
      packer build -force "$${PACKER_ARGS[@]}" || status=$$?

      if [ "$$status" -eq 0 ]; then
        echo "Packer test build succeeded. Tests passed."
        if [ -n "$$SOURCE_IMAGE" ]; then
          echo "Ensuring image $$SOURCE_IMAGE is active..."
          gcloud compute images deprecate "$$SOURCE_IMAGE" --state=ACTIVE --project=${PROJECT_ID} || true
        fi
      else
        echo "Packer test build failed."
        if [ -n "$$SOURCE_IMAGE" ]; then
          echo "Deprecating image $$SOURCE_IMAGE from family $$IMAGE_FAMILY due to test failure..."
          gcloud compute images deprecate "$$SOURCE_IMAGE" --state=DEPRECATED --project=${PROJECT_ID}
        else
          echo "Skipping deprecation (custom source_image override used or no image found)."
        fi
        exit 1
      fi
      
timeout: '1800s'
options:
  logging: CLOUD_LOGGING_ONLY
