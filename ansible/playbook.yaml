---
- name: Build ACI Image
  hosts: all
  become: yes
  roles:
    - os_configs
    - selinux
    - common
    - role: cloud_monitoring
      when:
      - not install_slurm
    - google-hpc-compute
    - docker
    - gcloud_cli
    - gcs_fuse
    - role: lustre
      when:
      - install_lustre
      - ansible_architecture == 'x86_64'
    - spack
    - lmod
    - role: nvidia_stack
      when:
      - install_nvidia_stack
    - role: slurm
      when:
      - install_slurm
    - role: ompi
      when:
      - install_slurm
    - role: rdma
    - role: nccl_gib
      when:
      - hw_type == "gpu"
    - cleanup
    - license_and_manifest
