---
- name: Install build dependencies for Python libraries (RedHat)
  become: true
  ansible.builtin.dnf:
    name:
      - gcc
      - libffi-devel
      - openssl-devel
    state: present

- name: Create Venv and set it up
  become: true
  ansible.builtin.pip:
    name:
      - setuptools
      - google-cloud-storage
      - google-auth<2.38.0
      - cffi
      - boto3
      - urllib3
      - requests
      - pyyaml
    virtualenv: /opt/spack-venv
    virtualenv_command: "/usr/bin/python3.11 -m venv"
    state: present

- name: Ensure machine-id is initialized for package scriptlets
  command: systemd-machine-id-setup
  become: yes
  args:
    creates: /etc/machine-id
