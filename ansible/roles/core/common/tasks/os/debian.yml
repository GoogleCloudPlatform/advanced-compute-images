---
- name: Wait for APT Lock
  shell: while fuser /var/lib/dpkg/lock >/dev/null 2>&1; do sleep 5; done;

- name: Force update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 0

- name: Run apt-get upgrade
  ansible.builtin.apt:
    upgrade: true

# dist-upgrade is necessary because "upgrade" refuses to install new
# dependencies
- name: Run apt-get dist-upgrade
  ansible.builtin.apt:
    upgrade: dist

- name: Update apt package index
  ansible.builtin.apt:
    name: "*"
    state: latest
    update_cache: true

- name: Disable unattended-upgrades to prevent apt lock contention on boot
  ansible.builtin.service:
    name: unattended-upgrades
    state: stopped
    enabled: false
  failed_when: false

- name: Disable apt-daily timers to prevent boot-time updates
  ansible.builtin.service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  failed_when: false
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer
