---
- name: RedHat | Install EPEL repository
  ansible.builtin.dnf:
    name: epel-release
    state: present

- name: RedHat | Enable CodeReady Linux Builder (CRB) repository
  ansible.builtin.command:
    cmd: dnf config-manager --set-enabled crb
  when: ansible_facts['distribution_major_version'] == '9'
  changed_when: false
  register: crb_result
  failed_when: "crb_result.rc != 0 and 'No matches found for argument' not in crb_result.stderr"

- name: RedHat | Enable PowerTools repository for version 8
  ansible.builtin.command:
    cmd: dnf config-manager --set-enabled powertools
  when: ansible_facts['distribution_major_version'] == '8'
  changed_when: false
  register: powertools_result
  failed_when: "powertools_result.rc != 0 and 'No matches found for argument' not in powertools_result.stderr"
