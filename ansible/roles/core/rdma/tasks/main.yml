---
- name: Include OS Family Dependent Vars for RDMA
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - vars/{{ ansible_facts['distribution']|lower }}-{{ ansible_facts['distribution_version'] }}.yml
    - vars/{{ ansible_facts['distribution']|lower }}-{{ ansible_facts['distribution_major_version'] }}.yml
    - vars/{{ ansible_facts['distribution']|lower }}.yml
  ignore_errors: true

- name: Include OS Family Dependent Tasks for RDMA
  ansible.builtin.include_tasks: "{{ item }}"
  with_first_found:
    - os/{{ ansible_facts['distribution']|lower }}-{{ ansible_facts['distribution_version'] }}.yml
    - os/{{ ansible_facts['distribution']|lower }}-{{ ansible_facts['distribution_major_version'] }}.yml
    - os/{{ ansible_facts['distribution']|lower }}.yml
