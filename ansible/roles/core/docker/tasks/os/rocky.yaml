---
- name: Update yum package cache
  ansible.builtin.dnf:
    update_cache: true

- name: "Rocky - Install dnf-plugins-core"
  ansible.builtin.package:
    name: dnf-plugins-core
    state: present
  become: true

- name: "Rocky - Add Docker repository"
  ansible.builtin.yum_repository:
    name: docker-ce
    description: Docker CE Stable Repository
    baseurl: https://download.docker.com/linux/centos/$releasever/$basearch/stable
    gpgcheck: true
    gpgkey: https://download.docker.com/linux/centos/gpg
    enabled: true
  become: true

- name: Install Docker CE and plugins
  ansible.builtin.yum:
    name: "{{item}}"
    state: present
  loop:
    - docker-ce
    - docker-ce-cli
    - containerd.io
    - docker-buildx-plugin
    - docker-compose-plugin

- name: Install docker-model-plugin on Rocky 9+
  ansible.builtin.yum:
    name: docker-model-plugin
    state: present
  when: ansible_facts['distribution_major_version'] | int >= 9
