---
- name: Add Docker GPG apt key (for Debian/Ubuntu)
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Add Docker apt repository (for Debian/Ubuntu)
  apt_repository:
    repo: deb [arch={{ 'arm64' if ansible_facts['architecture'] in ['aarch64', 'arm64'] else 'amd64' }}] https://download.docker.com/linux/ubuntu {{
      ansible_facts['distribution_release'] }} stable
    state: present

- name: Install Docker CE and plugins
  ansible.builtin.apt:
    name: "{{item}}"
    state: latest
  loop:
    - docker-ce
    - docker-ce-cli
    - containerd.io
    - docker-buildx-plugin
    - docker-compose-plugin
    - docker-model-plugin
