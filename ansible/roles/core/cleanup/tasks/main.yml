---
# -----------------------------------------------------------------
#  Spack Production Mirror Swap
# -----------------------------------------------------------------
- name: Set Spack initialization snippet
  ansible.builtin.set_fact:
    spack_init: |
      export SPACK_PYTHON=/opt/spack-venv/bin/python{{ python_version }}
      if [ -f "{{ spack_root }}/share/spack/setup-env.sh" ]; then
        . "{{ spack_root }}/share/spack/setup-env.sh"
      fi

- name: Swap Spack Mirrors for Production Image
  become: true
  become_user: "{{ hpc_user }}"
  ansible.builtin.shell: |
    {{ spack_init }}

    if command -v spack > /dev/null 2>&1; then
      # 1. Remove the private build cache to protect project credentials
      spack mirror remove --scope site hpc_cache || true

      # 2. Add the official Google Spack Cache
      spack mirror add --scope site "{{ google_spack_cache_name }}" "{{ google_spack_cache_url }}"

      # 3. Trust Google Spack Cache signing keys
      spack buildcache keys --install --trust
    fi
  when: "'spack' not in exclude_roles_list"

# -----------------------------------------------------------------
#  HDF5 Security Hardening & Cleanups
# -----------------------------------------------------------------
- name: Pin and block vulnerable system hdf5 packages on Ubuntu
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/block-hdf5
    content: |
      Package: hdf5-tools libhdf5-dev libhdf5-103 libhdf5-cpp-103 libhdf5-openmpi-103 libhdf5-openmpi-dev
      Pin: release *
      Pin-Priority: -1
    mode: "0644"
  when: ansible_facts['distribution'] == "Ubuntu"

- name: Purge vulnerable system hdf5 packages if installed
  become: true
  ansible.builtin.apt:
    name:
      - hdf5-tools
      - libhdf5-dev
      - libhdf5-103
      - libhdf5-cpp-103
      - libhdf5-openmpi-103
      - libhdf5-openmpi-dev
    state: absent
    purge: true
  when: ansible_facts['distribution'] == "Ubuntu"

- name: Remove libhdf5-dev from slurm-gcp playbook dependencies to prevent conflicts with Spack HDF5
  ansible.builtin.shell: |
    find /opt/slurm-gcp-repo/ansible -type f \( -name "*.yml" -o -name "*.yaml" \) -exec sed -i '/libhdf5-dev/d' {} +
  args:
    executable: /bin/bash
  failed_when: false
  when: ansible_facts['distribution'] == "Ubuntu"

# -----------------------------------------------------------------
#  Vulnerability Hardening & Package Upgrades
# -----------------------------------------------------------------
- name: Upgrade remaining unheld Ubuntu packages to latest security patches
  become: true
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    dpkg_options: "force-confdef,force-confold"
  environment:
    DEBIAN_FRONTEND: noninteractive
  when: ansible_facts['distribution'] == "Ubuntu"

- name: Check if /opt/ansible-venv pip exists
  ansible.builtin.stat:
    path: /opt/ansible-venv/bin/pip
  register: ansible_venv_pip

# On Rocky 8 /opt/ansible-venv runs Python 3.6, which pip 26 does not support,
# and the venv is removed at the end of the build. Skip the steps below that
# use its pip there.
- name: Skip the /opt/ansible-venv pip steps on Rocky 8
  ansible.builtin.set_fact:
    ansible_venv_pip:
      stat:
        exists: false
  when:
    - ansible_facts['distribution'] | lower == "rocky"
    - ansible_facts['distribution_major_version'] | string == "8"

- name: Upgrade core Python packages in /opt/ansible-venv
  become: true
  ansible.builtin.pip:
    name:
      - pip>=26.0
      - setuptools>=78.1.1
      - wheel>=0.46.2
    virtualenv: /opt/ansible-venv
    state: latest
  when: ansible_venv_pip.stat.exists

- name: Upgrade ansible-core in /opt/ansible-venv on Rocky 9
  become: true
  ansible.builtin.pip:
    name:
      - ansible-core>=2.16.13
    virtualenv: /opt/ansible-venv
    state: latest
  when:
    - ansible_venv_pip.stat.exists
    - ansible_facts['distribution'] | lower == "rocky"
    - ansible_facts['distribution_major_version'] | string == "9"

- name: Find vulnerable bundled Python wheels across system and Slurm directories
  ansible.builtin.find:
    paths:
      - /usr/share/python-wheels
      - /usr/lib/python3.12/test/wheeldata
      - /slurm/python/lib/python3.13/test/wheeldata
      - /slurm/python/lib/python3.13/ensurepip/_bundled
    patterns:
      - "pip-*.whl"
      - "setuptools-*.whl"
      - "wheel-*.whl"
  register: bundled_python_wheels

- name: Download patched replacement Python wheels into each matched directory
  become: true
  ansible.builtin.command:
    cmd: >-
      /opt/ansible-venv/bin/pip download --no-deps
      --dest {{ item.path | dirname }}
      {{ (item.path | basename).split('-')[0] }}
  loop: "{{ bundled_python_wheels.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  when: ansible_venv_pip.stat.exists

- name: Remove superseded bundled Python wheels after replacement download
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ bundled_python_wheels.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  when: ansible_venv_pip.stat.exists

- name: Find existing system wheel dist-info directories on Ubuntu
  ansible.builtin.find:
    paths: /usr/lib/python3/dist-packages
    patterns:
      - "wheel-*.dist-info"
      - "wheel-*.egg-info"
    file_type: directory
  register: old_system_wheel_distinfo
  when: ansible_facts['distribution'] == "Ubuntu"

- name: Upgrade system Python wheel package on Ubuntu
  become: true
  ansible.builtin.pip:
    name:
      - wheel>=0.46.2
    executable: /opt/ansible-venv/bin/pip
    extra_args: "--no-deps --target /usr/lib/python3/dist-packages"
    state: latest
  when:
    - ansible_facts['distribution'] == "Ubuntu"
    - ansible_venv_pip.stat.exists
    - (old_system_wheel_distinfo.matched | default(0)) > 0

- name: Remove superseded system wheel dist-info directories on Ubuntu
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ old_system_wheel_distinfo.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  when:
    - ansible_facts['distribution'] == "Ubuntu"
    - ansible_venv_pip.stat.exists
    - (old_system_wheel_distinfo.matched | default(0)) > 0

# -----------------------------------------------------------------
#  System Cleanups
# -----------------------------------------------------------------
- name: Clean Package Manager Caches (Debian)
  ansible.builtin.command: apt-get clean
  become: true
  when: ansible_facts['os_family'] == 'Debian'
  changed_when: false

- name: Clean Package Manager Caches (RedHat)
  ansible.builtin.command: dnf clean all
  become: true
  when: ansible_facts['os_family'] == 'RedHat'
  changed_when: false

- name: Remove Temporary Build Files
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/*
    - /var/tmp/*
  ignore_errors: true
