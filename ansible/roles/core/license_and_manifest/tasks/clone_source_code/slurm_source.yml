---
# Slurm is licensed under GPL-2.0-or-later. Ship the exact source tarball that
# slurm-gcp built Slurm from (downloaded to /usr/local/src), plus any patches
# applied on top of it (for example the TPU patch), so that the complete
# corresponding source is available in the image.
- name: Find the Slurm source tarball
  ansible.builtin.find:
    paths: /usr/local/src
    patterns: "slurm-*.tar.bz2"
  register: slurm_source_tarballs

- name: Copy the Slurm source tarball to the source code mirrors directory
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ source_code_mirrors_dir }}/{{ item.path | basename }}"
    remote_src: true
    mode: "0644"
  loop: "{{ slurm_source_tarballs.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  become: true
  ignore_errors: true

- name: Copy the patches applied to Slurm to the source code mirrors directory
  ansible.builtin.copy:
    src: "{{ slurm_repo_dest | default('/opt/slurm-gcp-repo') }}/ansible/roles/slurm/files/{{ item }}"
    dest: "{{ source_code_mirrors_dir }}/slurm-patches/"
    remote_src: true
    mode: "0644"
  loop: "{{ (slurm_extra_vars | default({})).slurm_patch_files | default([]) }}"
  become: true
  ignore_errors: true
