---
- name: Execute conditionally gated tasks natively
  block:
    - name: Include OS specific cloud monitoring tasks
      ansible.builtin.include_tasks: "{{ item }}"
      with_first_found:
        - files:
            - os/{{ ansible_facts['distribution']|lower }}-{{ ansible_facts['distribution_version'] }}.yml
            - os/{{ ansible_facts['distribution']|lower }}-{{ ansible_facts['distribution_major_version'] }}.yml
            - os/{{ ansible_facts['distribution']|lower }}.yml
          skip: true
      register: os_monitoring_tasks

    - name: Install Google Cloud Ops Agent
      when: os_monitoring_tasks.skipped is defined and os_monitoring_tasks.skipped
      block:
        - name: Download add-google-cloud-ops-agent-repo.sh
          ansible.builtin.get_url:
            url: https://dl.google.com/cloudagents/add-google-cloud-ops-agent-repo.sh
            dest: /tmp/add-google-cloud-ops-agent-repo.sh
            mode: "0755"
          register: download_script
          until: download_script is success
          retries: 5
          delay: 5

        - name: Run add-google-cloud-ops-agent-repo.sh --also-install
          ansible.builtin.command: /tmp/add-google-cloud-ops-agent-repo.sh --also-install
          register: install_ops_agent
          until: install_ops_agent is success
          retries: 5
          delay: 10

    - name: Stop and disable google-cloud-ops-agent service on CPU workloads
      ansible.builtin.systemd:
        name: google-cloud-ops-agent
        state: stopped
        enabled: false
      when: hw_type == "cpu"
  when: not (install_slurm | default(false) | bool)
