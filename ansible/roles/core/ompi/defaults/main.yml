---
ompi_target: "{{ 'target=x86_64_v3' if ansible_facts['architecture'] == 'x86_64' else '' }}"
ompi_version: "5.0.8"
mpi_spec: "openmpi@{{ ompi_version }} schedulers=slurm {{ ompi_target }}"
ompi_view_path: "{{ apps_path }}/openmpi"
slurm_version: "26.05.4"
slurm_prefix: "/usr/local"
pmix_version: "4.2.9"
