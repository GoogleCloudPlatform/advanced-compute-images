---
- name: Execute conditionally gated tasks natively
  block:
    - name: Include OS Vars
      ansible.builtin.include_vars: "{{ item }}"
      with_first_found:
        - "{{ ansible_facts['distribution']|lower }}-{{ ansible_facts['distribution_version'] }}.yml"
        - "{{ ansible_facts['distribution']|lower }}-{{ ansible_facts['distribution_major_version'] }}.yml"
        - "{{ ansible_facts['distribution']|lower }}.yml"
        - "{{ ansible_facts['os_family']|lower }}-{{ ansible_facts['distribution_version'] }}.yml"
        - "{{ ansible_facts['os_family']|lower }}-{{ ansible_facts['distribution_major_version'] }}.yml"
        - "{{ ansible_facts['os_family']|lower }}.yml"
      when: install_lustre

    - name: Include OS Family Dependent Tasks
      include_tasks: "{{ item }}"
      with_first_found:
        - os/{{ ansible_facts['distribution']|lower }}-{{ ansible_facts['distribution_version'] }}.yml
        - os/{{ ansible_facts['distribution']|lower }}-{{ ansible_facts['distribution_major_version'] }}.yml
        - os/{{ ansible_facts['distribution']|lower }}.yml
        - os/{{ ansible_facts['os_family']|lower }}-{{ ansible_facts['distribution_version'] }}.yml
        - os/{{ ansible_facts['os_family']|lower }}-{{ ansible_facts['distribution_major_version'] }}.yml
        - os/{{ ansible_facts['os_family']|lower }}.yml
      when: install_lustre

    - name: Wait for DPKG Locks
      ansible.builtin.shell: >
        while fuser /var/lib/dpkg/{{ item }} >/dev/null 2>&1; do
          sleep 5
        done
      with_items:
        - lock
        - lock-frontend
      when:
        - install_lustre
        - ansible_facts['os_family'] == 'Debian'

    - name: Check for pre-compiled Lustre kernel modules
      ansible.builtin.shell: dpkg-query -W -f='${Status}\n' 'lustre-client-modules-*' 2>/dev/null | grep -c "ok installed" || true
      register: lustre_precompiled_check
      when:
        - install_lustre
        - ansible_facts['os_family'] == 'Debian'

    - name: Omit DKMS if a pre-compiled Lustre module is already installed (fixes idempotency)
      ansible.builtin.set_fact:
        lustre_packages: "{{ lustre_packages | reject('search', 'dkms') | list }}"
      when:
        - install_lustre
        - ansible_facts['os_family'] == 'Debian'
        - lustre_precompiled_check.stdout is defined
        - lustre_precompiled_check.stdout | int > 0

    - name: Install Lustre Client Packages
      package:
        name: "{{ lustre_packages }}"
        state: present
      when:
        - install_lustre
        - lustre_packages | length > 0

    - name: Ensure Lustre DKMS modules are built for all target kernels
      ansible.builtin.shell: |
        set -ex
        # Find the Lustre module name and version from dkms status (e.g., lustre-client-modules/2.14.0-ddn249)
        # The || true prevents set -e from killing the script if grep returns nothing.
        MODULE_INFO=$(dkms status | grep -i lustre | head -n 1 || true)

        if [ -n "$MODULE_INFO" ]; then
          MODULE_NAME=$(echo "$MODULE_INFO" | awk -F/ '{print $1}')
          # Strip any trailing architectures or generic installed branches from the version string correctly (Bash Regex Patch preserved)
          MODULE_VERSION=$(echo "$MODULE_INFO" | awk -F/ '{print $2}' | awk -F, '{print $1}' | awk -F: '{print $1}')

          # Build the module natively for any kernel that has headers installed in the image
          for k in $(ls -1 /lib/modules); do
            if [ -d "/lib/modules/$k/build" ]; then
              echo "Building DKMS module $MODULE_NAME version $MODULE_VERSION for kernel $k..."
              dkms install -m "$MODULE_NAME" -v "$MODULE_VERSION" -k "$k"
            else
              echo "Headers missing for $k, skipping DKMS build."
            fi
          done
        else
          echo "Lustre module not found in dkms status."
        fi
      become: true
      when:
        - install_lustre
        - ansible_facts['os_family'] == 'Debian'
  when: (install_lustre | default(false) | bool) and ansible_facts['architecture'] == 'x86_64'
