---
- name: Add gpudirect-gib-rpm repo (RedHat)
  ansible.builtin.yum_repository:
    name: gpudirect-gib-rpm
    description: NCCL/gIB
    baseurl: https://packages.cloud.google.com/yum/repos/gpudirect-gib-rpm
    enabled: true
    gpgcheck: false
    repo_gpgcheck: true
    gpgkey:
      - "https://packages.cloud.google.com/yum/doc/yum-key.gpg"
      - "https://packages.cloud.google.com/yum/doc/rpm-package-key.gpg"
    state: present

- name: "Install NCCL stack: nccl-gib, libnccl, and libnccl-devel"
  # We install the NCCL stacks (library, development headers, and GIB plugin)
  # with specific versions for image consistency.
  ansible.builtin.package:
    name:
      - "nccl-gib-{{nccl_gib_version}}"
      - "libnccl-{{nccl_version}}"
      - "libnccl-devel-{{nccl_version}}"
    state: latest
    update_cache: true

- name: Ensure NCCL/gIB environment script is configured in /etc/profile.d
  ansible.builtin.copy:
    dest: /etc/profile.d/nccl_env.sh
    content: |
      # Source the official NCCL/gIB environment script
      if [ -f /usr/local/gib/scripts/set_nccl_env.sh ]; then
        . /usr/local/gib/scripts/set_nccl_env.sh
      fi
      case ":${LD_LIBRARY_PATH}:" in
        *":/usr/local/gib/lib64:"*)
          # /usr/local/gib/lib64 is already in LD_LIBRARY_PATH
          ;;
        *)
          export LD_LIBRARY_PATH="/usr/local/gib/lib64${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          ;;
      esac
    owner: root
    group: root
    mode: "0755" # Make the script executable so it's sourced by /etc/profile
  become: true
