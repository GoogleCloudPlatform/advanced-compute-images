---
- name: Increase system resource limits
  ansible.builtin.copy:
    dest: /etc/security/limits.d/99-unlimited.conf
    content: |
      * - memlock unlimited
      * - nproc unlimited
      * - stack 8192
      * - nofile 1048576
      * - cpu unlimited
      * - rtprio unlimited

- name: Include OS-specific tasks
  include_tasks: "{{ item }}"
  with_first_found:
    - "os/{{ ansible_facts['distribution']|lower }}-{{ ansible_facts['distribution_version'] }}.yml"
    - "os/{{ ansible_facts['distribution']|lower }}-{{ ansible_facts['distribution_major_version'] }}.yml"
    - "os/{{ ansible_facts['distribution']|lower }}.yml"

- name: Include TPU-specific tasks
  ansible.builtin.include_tasks: tpu.yml
  when: hw_type == "tpu"
