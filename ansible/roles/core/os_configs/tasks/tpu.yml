---
- name: Remove Nsight components from CUDA
  ansible.builtin.shell: |
    # Configuration: Set the path to your CUDA installation
    CUDA_INSTALL_PATH="/usr/local/cuda"

    if [ -d "${CUDA_INSTALL_PATH}" ]; then
      echo "Removing Nsight components from ${CUDA_INSTALL_PATH}..."

      for d in "${CUDA_INSTALL_PATH}/nsight-compute-"*; do
        if [ -d "$d" ]; then
          rm -rf "$d"
        fi
      done

      for d in "${CUDA_INSTALL_PATH}/nsight-systems-"*; do
        if [ -d "$d" ]; then
          rm -rf "$d"
        fi
      done

      rm -f "${CUDA_INSTALL_PATH}/bin/ncu"
      rm -f "${CUDA_INSTALL_PATH}/bin/ncu-ui"
      rm -f "${CUDA_INSTALL_PATH}/bin/nsight-sys"
      rm -f "${CUDA_INSTALL_PATH}/bin/nsys"
      rm -f "${CUDA_INSTALL_PATH}/bin/nsys-ui"
      rm -rf "${CUDA_INSTALL_PATH}/nsightee_plugins"
      rm -f "${CUDA_INSTALL_PATH}/bin/nsight_ee_plugins_manage.sh"
    fi
  ignore_errors: true

- name: Create Enroot configuration directory
  ansible.builtin.file:
    path: /etc/enroot
    state: directory
    mode: "0755"

- name: Configure Enroot
  ansible.builtin.copy:
    content: |
      ENROOT_CONFIG_PATH     ${HOME}/.enroot
      ENROOT_RUNTIME_PATH    /tmp/${UID}/runtime
      ENROOT_CACHE_PATH      /tmp/${UID}/cache
      ENROOT_DATA_PATH       /tmp/${UID}/data
      ENROOT_TEMP_PATH       /tmp/${UID}/tmp
    dest: /etc/enroot/enroot.conf
    mode: '0644'

- name: Copy third party licenses
  ansible.builtin.shell: |
    mkdir -p /usr/share/third_party/open-source/
    mkdir -p /usr/share/third_party/proprietary-source/
    gcloud storage cp gs://ospo-hcs-licenses/THIRD_PARTY_NOTICES.txt /usr/share/third_party/ || true
    gcloud storage cp --recursive gs://ospo-hcs-licenses/open-source/ /usr/share/third_party/ || true
    gcloud storage cp --recursive gs://ospo-hcs-licenses/proprietary-source/ /usr/share/third_party/ || true
  ignore_errors: true
