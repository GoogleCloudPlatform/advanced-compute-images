---
# -----------------------------------------------------------------
# Install Lmod USING Spack
# -----------------------------------------------------------------
- name: Set Spack initialization snippet
  ansible.builtin.set_fact:
    spack_init: |
      export SPACK_PYTHON=/opt/spack-venv/bin/python{{ python_version }}
      . {{ spack_root }}/share/spack/setup-env.sh

- name: Install Lmod via Spack
  ansible.builtin.shell: |
    {{ spack_init }}
    spack install --use-cache lmod {{ lmod_target }}
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ hpc_user }}"
  register: lmod_install
  changed_when: "'installed' in lmod_install.stdout"

- name: Create Spack GPG Key for Signing
  become: true
  become_user: "{{ hpc_user }}"
  ansible.builtin.shell: |
    {{ spack_init }}
    # Only create if no private keys exist
    if [ $(spack gpg list --private | wc -l) -eq 0 ]; then
      spack gpg create "{{ spack_gpg_name | default('HPC Admin') }}" "{{ spack_gpg_email | default('admin@example.com') }}"
    fi
  args:
    executable: /bin/bash

# -----------------------------------------------------------------
#  Push Lmod to Cache (Save for next time)
# -----------------------------------------------------------------
- name: Push Lmod to GCS Cache
  become: true
  become_user: "{{ hpc_user }}"
  ansible.builtin.shell: |
    {{ spack_init }}
    SPEC="lmod"
    MIRROR_NAME="hpc_cache"

    # Check if this spec is already in the cache
    if ! spack buildcache check --mirror-url {{ spack_cache_url }} $SPEC ; then
       spack buildcache push --force "$MIRROR_NAME" $SPEC
    fi
  args:
    executable: /bin/bash
  # Run this every time to ensure cache is populated
  when: true

# -----------------------------------------------------------------
# Dynamic Discovery
# -----------------------------------------------------------------
- name: Get Lmod Installation Path
  ansible.builtin.shell: |
    {{ spack_init }}
    spack location -i lmod
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ hpc_user }}"
  register: lmod_location

- name: Debug Lmod Location
  ansible.builtin.debug:
    msg: "Spack installed Lmod at: {{ lmod_location.stdout }}"

- name: Get Spack Architecture String
  ansible.builtin.shell: |
    {{ spack_init }}
    spack arch
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ hpc_user }}"
  register: spack_arch_string

- name: Force generation of Lmod-specific module files
  ansible.builtin.shell: |
    {{ spack_init }}
    spack module lmod refresh -y
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ hpc_user }}"

# -----------------------------------------------------------------
# System Integration
# -----------------------------------------------------------------
- name: Create Global Profile Script for Spack-Lmod
  become: true
  ansible.builtin.copy:
    dest: /etc/profile.d/z00_spack_lmod.sh
    content: |
      # Note: Spack is already initialized by /etc/profile.d/01-spack.sh

      # 1. Initialize Lmod
      . {{ lmod_location.stdout }}/lmod/lmod/init/bash

      LMOD_ROOT=$(ls -d $SPACK_ROOT/share/spack/lmod/linux-* 2>/dev/null | head -n 1)

      if [ -d "$LMOD_ROOT" ]; then
          module use "$LMOD_ROOT/Core"
          COMPILER_DIR=$(ls -d $LMOD_ROOT/gcc/* 2>/dev/null | head -n 1)
          if [ -n "$COMPILER_DIR" ]; then
              module use "$COMPILER_DIR"
          fi
      fi
    mode: "0644"
