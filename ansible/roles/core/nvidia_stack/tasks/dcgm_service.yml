---
# DCGM ships unmodified, so NVIDIA's nvidia-dcgm.service unit file is never
# edited. Local settings go in a systemd drop-in instead.
- name: Create nvidia-dcgm drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/nvidia-dcgm.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Disable DCGM hang detection with a systemd drop-in
  ansible.builtin.copy:
    dest: /etc/systemd/system/nvidia-dcgm.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Service]
      Environment="DCGM_HANGDETECT_DISABLE=1"
  become: true
  notify: Reload SystemD

- name: Disable NVIDIA DCGM service by default (enable during boot on GPU nodes)
  ansible.builtin.systemd:
    name: nvidia-dcgm.service
    state: stopped
    enabled: false
    daemon_reload: true
  become: true
