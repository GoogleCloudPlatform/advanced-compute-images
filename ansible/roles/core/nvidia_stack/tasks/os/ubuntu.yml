---
- name: Set DEBIAN_FRONTEND to noninteractive in /etc/environment
  ansible.builtin.lineinfile:
    path: /etc/environment
    line: "DEBIAN_FRONTEND=noninteractive"
    create: true
    state: present

# ---------- Install Prerequisites ----------
- name: Install gcc-12 for kernel module compatibility
  ansible.builtin.apt:
    name: gcc-12
    state: present
  become: true
  when: ansible_facts['distribution_major_version'] | int >= 24

# ---------- Install CUDA ----------
- name: Check whether the CUDA Toolkit is already installed
  ansible.builtin.stat:
    path: "/usr/local/cuda-{{ cuda_version.split('.')[:2] | join('.') }}"
  register: cuda_toolkit_dir

- name: Download CUDA installer from NVIDIA
  ansible.builtin.get_url:
    url: "{{ cuda_runfile_url }}"
    dest: "{{ nvidia_installation_path }}/{{ cuda_installer_file_name }}"
    mode: "0755"
  register: cuda_download
  changed_when: cuda_download.changed
  when: not cuda_toolkit_dir.stat.exists
- name: Run CUDA installer
  ansible.builtin.command:
    cmd: "{{ nvidia_installation_path }}/{{ cuda_installer_file_name }} --silent --toolkit"
  args:
    creates: /usr/local/cuda-{{ cuda_version.split('.')[:2] | join('.') }}

# The CUDA Toolkit ships whole, including the bundled Nsight Compute and Nsight
# Systems, under the NVIDIA Software Distribution Amendment. Only the multi-GB
# installer itself is removed from the image.
- name: Remove CUDA installer from the image
  ansible.builtin.file:
    path: "{{ nvidia_installation_path }}/{{ cuda_installer_file_name }}"
    state: absent
  become: true

# Images built before GA blocked Nsight packages from NVIDIA's repo. Remove that
# preference and keep only the lower priority for the NVIDIA CUDA repo, so the
# Ubuntu archive stays preferred for packages present in both.
- name: Remove apt preference that blocked Nsight packages from NVIDIA repo
  ansible.builtin.file:
    path: /etc/apt/preferences.d/99-nvidia-cuda-exclude-nsight.pref
    state: absent
  become: true

- name: Create apt preference for NVIDIA CUDA repo priority
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/99-nvidia-cuda-repo-priority.pref
    mode: "0644"
    owner: root
    group: root
    content: |
      Package: *
      Pin: release l=NVIDIA CUDA
      Pin-Priority: 400
  become: true

# ---------- Configure NVIDIA CUDA apt repository ----------
- name: Download CUDA keyring
  ansible.builtin.get_url:
    url: "{{ cuda_repo_keyring_url }}"
    dest: "{{ nvidia_installation_path }}/cuda-keyring_1.1-1_all.deb"
    mode: "0644"
  become: true

- name: Install CUDA keyring
  ansible.builtin.apt:
    deb: "{{ nvidia_installation_path }}/cuda-keyring_1.1-1_all.deb"
  become: true

- name: Remove the downloaded CUDA keyring package from the image
  ansible.builtin.file:
    path: "{{ nvidia_installation_path }}/cuda-keyring_1.1-1_all.deb"
    state: absent
  become: true

- name: Update apt cache after adding CUDA repo
  ansible.builtin.apt:
    update_cache: true
  become: true

# ---------- Install cuDNN ----------
- name: Install and pin cuDNN
  block:
    - name: Install cuDNN packages
      ansible.builtin.apt:
        name: "{{ cudnn_packages | map('regex_replace', '$', '=' ~ cudnn_version) | list }}"
        state: present

    - name: Freeze cuDNN package versions
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop: "{{ cudnn_packages }}"
  become: true
  when: install_cudnn | default(true) | bool

- name: Add CUDA lib path to ld.so.conf.d
  ansible.builtin.lineinfile:
    path: /etc/ld.so.conf.d/nvidia-cuda.conf
    line: "/usr/local/cuda/lib64"
    create: true
    owner: root
    group: root
    mode: "0644"
  notify: run ldconfig

# Section: NVIDIA Container Toolkit Installation
- name: Add NVIDIA Container Toolkit GPG key
  ansible.builtin.apt_key:
    url: https://nvidia.github.io/libnvidia-container/gpgkey
    keyring: /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
    state: present
- name: Add NVIDIA Container Toolkit repository
  ansible.builtin.shell:
    cmd: >
      curl -s -L https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list |
      sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g' |
      tee /etc/apt/sources.list.d/nvidia-container-toolkit.list
  args:
    creates: /etc/apt/sources.list.d/nvidia-container-toolkit.list
- name: Create apt preference to block broken nvidia-container-toolkit version
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/block-broken-nvidia-container
    mode: "0644"
    owner: root
    group: root
    content: |
      Package: nvidia-container-toolkit nvidia-container-toolkit-base libnvidia-container-tools libnvidia-container1
      Pin: version 1.17.7-1
      Pin-Priority: 100
  become: true
- name: Update apt cache after adding NVIDIA Container Toolkit repo
  ansible.builtin.apt:
    update_cache: true

- name: Install NVIDIA Container Toolkit
  ansible.builtin.apt:
    name:
      - "nvidia-container-toolkit={{ nvidia_container_toolkit_version }}"
      - "nvidia-container-toolkit-base={{ nvidia_container_toolkit_version }}"
      - "libnvidia-container-tools={{ nvidia_container_toolkit_version }}"
      - "libnvidia-container1={{ nvidia_container_toolkit_version }}"
    state: present
    update_cache: false

- name: Freeze NVIDIA Container Toolkit package versions
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - nvidia-container-toolkit
    - nvidia-container-toolkit-base
    - libnvidia-container-tools
    - libnvidia-container1
  become: true

# ---------- Install NVIDIA Driver Components ----------
# nvidia_driver_version pins the driver packages to one Ubuntu archive release
# (set per build profile, next to fabric_manager_version). The precompiled kernel
# module package is versioned per kernel ABI and already depends on one exact
# nvidia-kernel-common version, so it stays unpinned.
- name: Set NVIDIA Driver packages fact
  ansible.builtin.set_fact:
    nvidia_packages: "{{ [kernel_modules_package] + driver_packages }}"
    nvidia_package_specs: >-
      {{ [kernel_modules_package]
         + ((driver_packages | map('regex_replace', '$', '=' ~ nvidia_driver_version) | list)
            if (nvidia_driver_version | default('') | length > 0) else driver_packages) }}
  vars:
    kernel_modules_package: "linux-modules-nvidia-{{ nvidia_driver_package_version }}-open-{{ ansible_facts['kernel'] }}"
    base_packages:
      - "nvidia-compute-utils-{{ nvidia_driver_package_version }}"
      - "nvidia-kernel-common-{{ nvidia_driver_package_version }}"
      - "nvidia-utils-{{ nvidia_driver_package_version }}"
      - "libnvidia-cfg1-{{ nvidia_driver_package_version }}"
      - "libnvidia-nscq-{{ nvidia_driver_package_version.split('-')[0] }}"
    arm_packages:
      - "nvidia-imex-{{ nvidia_driver_package_version.split('-')[0] }}"
    driver_packages: "{{ base_packages + (arm_packages if ansible_facts['architecture'] in ['aarch64', 'arm64'] else []) }}"

- name: Install NVIDIA Driver packages for the running kernel
  ansible.builtin.apt:
    name: "{{ nvidia_package_specs }}"
    state: present
  notify: Reload SystemD

- name: Freeze NVIDIA Driver package versions
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: "{{ nvidia_packages }}"
  become: true

# ---------- Configure NVIDIA Persistence Mode ----------
- name: Create nvidia-persistenced override directory
  ansible.builtin.file:
    path: /etc/systemd/system/nvidia-persistenced.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Configure nvidia-persistenced override for persistence mode
  ansible.builtin.copy:
    dest: /etc/systemd/system/nvidia-persistenced.service.d/persistence_mode.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Service]
      ExecStart=
      ExecStart=/usr/bin/nvidia-persistenced --user nvidia-persistenced --verbose
  become: true
  notify: Reload SystemD

# ---------- Install Fabric Manager ----------

- name: Download Fabric Manager installer
  ansible.builtin.get_url:
    url: "https://developer.download.nvidia.com/compute/cuda/repos/{{ ansible_facts['distribution'] | lower }}{{ ansible_facts['distribution_major_version'] }}04/{{
      'sbsa' if ansible_facts['architecture'] == 'aarch64' else 'x86_64' }}/{{ fabricmanager_deb }}"
    dest: "{{ nvidia_installation_path }}/{{ fabricmanager_deb }}"
    mode: "0755"
  register: fabricmanager_download
  changed_when: fabricmanager_download.changed

- name: Install Fabric Manager from .deb
  ansible.builtin.apt:
    deb: "{{ nvidia_installation_path }}/{{ fabricmanager_deb }}"
  become: true

# Hold Fabric Manager like the driver packages. Later steps (the slurm-gcp
# playbook and the final apt upgrade in the cleanup role) run apt upgrades, and
# NVIDIA's repo carries newer Fabric Manager releases that would otherwise
# replace the pinned one.
- name: Freeze Fabric Manager package version
  ansible.builtin.dpkg_selections:
    name: nvidia-fabricmanager
    selection: hold
  become: true

- name: Remove the downloaded Fabric Manager package from the image
  ansible.builtin.file:
    path: "{{ nvidia_installation_path }}/{{ fabricmanager_deb }}"
    state: absent
  become: true

# ---------- Install NVIDIA DOCA ----------
- name: Install NVIDIA DOCA (Data Center Infrastructure-on-a-Chip Architecture)
  block:
    - name: Add NVIDIA DOCA GPG key
      ansible.builtin.get_url:
        url: "https://linux.mellanox.com/public/repo/doca/GPG-KEY-Mellanox.pub"
        dest: "/usr/share/keyrings/GPG-KEY-Mellanox.pub"
        mode: "0644"
      become: true

    - name: Add NVIDIA DOCA repository
      ansible.builtin.shell:
        cmd: >
          echo "deb [signed-by=/usr/share/keyrings/GPG-KEY-Mellanox.pub] {{ doca_repo_url }} /" |
          tee /etc/apt/sources.list.d/doca.list
      args:
        creates: /etc/apt/sources.list.d/doca.list
      become: true

    - name: Update apt cache after adding DOCA repo
      ansible.builtin.apt:
        update_cache: true
      become: true

    - name: Install DOCA OFED
      ansible.builtin.apt:
        name: doca-ofed
        state: present
      become: true
  when: install_doca

# ---------- Install DCGM ----------
# NVIDIA's DCGM 4 packages are installed unmodified. Service configuration lives
# in a systemd drop-in (see tasks/dcgm_service.yml), never in NVIDIA's unit file.
- name: Install and pin DCGM
  block:
    - name: Install DCGM packages
      ansible.builtin.apt:
        name: "{{ dcgm_packages | map('regex_replace', '$', '=' ~ dcgm_package_version) | list }}"
        state: present

    - name: Freeze DCGM package versions
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop: "{{ dcgm_packages }}"
  become: true
  when: install_dcgm | default(false) | bool

# ---------- Disable GPU services ----------
- name: Disable NVIDIA GPU services by default (enable during boot on GPU nodes)
  ansible.builtin.service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  become: true
  loop:
    - nvidia-persistenced.service
