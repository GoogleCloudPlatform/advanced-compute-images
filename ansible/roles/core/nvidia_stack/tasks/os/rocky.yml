---
# ---------- Install CUDA Repository ----------
- name: Download CUDA .repo file to /etc/yum.repos.d/
  ansible.builtin.get_url:
    url: "{{ cuda_repo_url }}"
    dest: /etc/yum.repos.d/cuda.repo
    mode: "0644"
  register: cuda_repo_download
  changed_when: cuda_repo_download.changed
  notify: Update dnf cache

- name: Import NVIDIA CUDA GPG key
  ansible.builtin.rpm_key:
    state: present
    key: "{{ cuda_gpg_key_url }}"
  register: cuda_key_import
  changed_when: cuda_key_import.changed
  notify: Update dnf cache

# ---------- Install CUDA Toolkit ----------
- name: Install CUDA Toolkit packages
  ansible.builtin.dnf:
    name: "cuda-toolkit-{{ cuda_version.split('.')[0] }}"
    state: present
    exclude:
      - nsight-compute
      - nsight-systems
  register: cuda_toolkit_install

- name: Add CUDA lib path to ld.so.conf.d
  ansible.builtin.lineinfile:
    path: /etc/ld.so.conf.d/nvidia-cuda.conf
    line: "/usr/local/cuda/lib64"
    create: true
    owner: root
    group: root
    mode: "0644"
  notify: run ldconfig

# ---------- Install NVIDIA Container Toolkit ----------
- name: Add NVIDIA Container Toolkit repository for RHEL
  ansible.builtin.shell:
    cmd: >
      curl -s -L https://nvidia.github.io/libnvidia-container/stable/rpm/nvidia-container-toolkit.repo |
      tee /etc/yum.repos.d/nvidia-container-toolkit.repo
  args:
    creates: /etc/yum.repos.d/nvidia-container-toolkit.repo
  changed_when: true
  notify: Update dnf cache

- name: Install NVIDIA Container Toolkit
  ansible.builtin.dnf:
    name:
      - "nvidia-container-toolkit-{{ nvidia_container_toolkit_version }}"
      - "nvidia-container-toolkit-base-{{ nvidia_container_toolkit_version }}"
      - "libnvidia-container-tools-{{ nvidia_container_toolkit_version }}"
      - "libnvidia-container1-{{ nvidia_container_toolkit_version }}"
    state: present
  register: nvidia_container_toolkit_install

# ---------- Install NVIDIA Driver Components ----------
- name: Ensure NVIDIA driver module stream is enabled for proprietary drivers
  ansible.builtin.command: "dnf module enable -y nvidia-driver:{{ nvidia_driver_package_version }}"
  args:
    creates: "/etc/dnf/modules.d/nvidia-driver.module"
  changed_when: true
  notify: Update dnf cache

- name: Install NVIDIA proprietary driver packages via cuda-drivers meta-package
  ansible.builtin.dnf:
    name: cuda-drivers
    state: present
  notify: Reload SystemD

# ---------- Configure NVIDIA Persistence Mode for Rocky Linux ----------
- name: Create nvidia-persistenced override directory
  ansible.builtin.file:
    path: /etc/systemd/system/nvidia-persistenced.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Configure nvidia-persistenced override for persistence mode
  ansible.builtin.copy:
    dest: /etc/systemd/system/nvidia-persistenced.service.d/persistence_mode.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Service]
      ExecStart=
      ExecStart=/usr/bin/nvidia-persistenced --user nvidia-persistenced --verbose
  become: true
  notify: Reload SystemD

# ---------- Configure services to start on boot ----------
- name: Create nvidia services startup script
  ansible.builtin.copy:
    dest: /usr/local/bin/startup-nvidia-services.sh
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/bin/bash
      set -e
      # Enable and start services. Enable ensures they start on subsequent reboots.
      systemctl enable nvidia-persistenced.service
      systemctl start nvidia-persistenced.service
  become: true

- name: Create systemd service for nvidia startup script
  ansible.builtin.copy:
    dest: /etc/systemd/system/nvidia-startup.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Enable and start NVIDIA services on boot
      After=multi-user.target

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/startup-nvidia-services.sh

      [Install]
      WantedBy=multi-user.target
  become: true
  notify: Reload SystemD

- name: Enable nvidia-startup service
  ansible.builtin.systemd:
    name: nvidia-startup.service
    enabled: true
  become: true

# ---------- Install Fabric Manager ----------
- name: Install NVIDIA Fabric Manager from NVIDIA CUDA repo
  ansible.builtin.dnf:
    name: "https://developer.download.nvidia.com/compute/cuda/repos/rhel{{ ansible_facts['distribution_major_version'] }}/x86_64/nvidia-fabric-manager-{{ fabric_manager_version
      }}-1.x86_64.rpm"
    state: present
  become: true

# ---------- Install NVIDIA DOCA ----------
- name: Install NVIDIA DOCA (Data Center Infrastructure-on-a-Chip Architecture)
  block:
    - name: Add NVIDIA DOCA repository for Rocky
      ansible.builtin.yum_repository:
        name: doca
        description: NVIDIA DOCA Repository
        baseurl: "{{ doca_repo_url }}"
        gpgkey: "{{ doca_repo_url }}/GPG-KEY-Mellanox.pub"
        gpgcheck: true
      become: true

    - name: Install DOCA OFED for Rocky
      ansible.builtin.dnf:
        name: doca-ofed
        state: present
      become: true
  when: install_doca

# ---------- Disable GPU services ----------
- name: Disable NVIDIA GPU services by default (enable during boot on GPU nodes)
  ansible.builtin.service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  become: true
  loop:
    - nvidia-persistenced.service

- name: Delete non-distributable files after NVIDIA stack installation
  ansible.builtin.file:
    path: "/usr/local/cuda/lib64/{{ item }}"
    state: absent
  loop:
    - libOpenCL.so
    - libOpenCL.so.1
    - libOpenCL.so.1.0
    - libOpenCL.so.1.0.0
    - libaccinj64.so
    - libaccinj64.so.12.8
    - libaccinj64.so.12.8.57
    - libcufilt.a
    - libcuinj64.so
    - libcuinj64.so.12.8
    - libcuinj64.so.12.8.5
    - libcuinj64.so.12.8.57
    - libmetis_static.a
  become: true
