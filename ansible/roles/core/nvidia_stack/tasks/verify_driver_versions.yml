---
# Fabric Manager only starts when its version matches the NVIDIA driver version
# exactly, and NSCQ (and IMEX on Ubuntu arm64) ship from the same release. Stop
# the build if they differ, for example when the Ubuntu archive moves the
# 595-server driver to a newer release than fabric_manager_version.
- name: Read the installed NVIDIA driver, Fabric Manager, NSCQ and IMEX versions
  ansible.builtin.shell: |
    set -euo pipefail
    {% if ansible_facts['os_family'] == 'Debian' %}
    v() { dpkg-query -W -f='${Version}' "$1"; }
    driver=$(v "nvidia-kernel-common-{{ nvidia_driver_package_version }}")
    fabric_manager=$(v nvidia-fabricmanager)
    nscq=$(v "libnvidia-nscq-{{ nvidia_driver_package_version.split('-')[0] }}")
    {% else %}
    v() { rpm -q --qf '%{VERSION}' "$1"; }
    driver=$(v nvidia-driver)
    fabric_manager=$(v nvidia-fabricmanager)
    nscq=$(v libnvidia-nscq)
    {% endif %}
    echo "${driver%%-*} ${fabric_manager%%-*} ${nscq%%-*}"
    {% if _check_imex | bool %}
    imex=$(v "nvidia-imex-{{ nvidia_driver_package_version.split('-')[0] }}")
    echo "${imex%%-*}"
    {% endif %}
  args:
    executable: /bin/bash
  register: nvidia_package_versions
  changed_when: false
  become: true
  vars:
    _check_imex: "{{ ansible_facts['os_family'] == 'Debian' and ansible_facts['architecture'] in ['aarch64', 'arm64'] }}"

- name: Check that Fabric Manager, NSCQ and IMEX match the NVIDIA driver version
  ansible.builtin.assert:
    that:
      - _versions | length == _names | length
      - _versions | unique | length == 1
    fail_msg: >-
      NVIDIA versions differ:
      {% for name in _names %}{{ name }} {{ _versions[loop.index0] | default('?') }}{{ '' if loop.last else ', ' }}{% endfor %}.
      Move them to the same release together in the build profile:
      nvidia_driver_version (Ubuntu), fabric_manager_version and
      fabricmanager_deb (Ubuntu).
    success_msg: "{{ _names | join(', ') }} are all {{ _versions[0] | default('?') }}"
  vars:
    _check_imex: "{{ ansible_facts['os_family'] == 'Debian' and ansible_facts['architecture'] in ['aarch64', 'arm64'] }}"
    _names: "{{ ['driver', 'Fabric Manager', 'NSCQ'] + (['IMEX'] if (_check_imex | bool) else []) }}"
    _versions: "{{ nvidia_package_versions.stdout.split() }}"
