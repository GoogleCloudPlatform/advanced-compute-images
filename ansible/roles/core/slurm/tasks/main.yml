# helm-gcp-releases repo is no longer maintained and is missing the Release file.
# Remove broken helm-gcp-releases repository that causes apt update to fail.
# Remove conflicting dkms package to allow installation of kernel-specific lustre client modules in the slurm-gcp playbook.
# Proactively add Official MariaDB 10.11 LTS Repository to pull patched database builds

---
- name: Execute conditionally gated tasks natively
  block:
    - name: Clone slurm-gcp repository
      ansible.builtin.git:
        repo: https://github.com/GoogleCloudPlatform/slurm-gcp
        dest: /opt/slurm-gcp-repo
        version: "{{ build_slurm_from_git_ref }}"
        force: true

    - name: Patch slurm-gcp ansible/playbook.yml to fix version_compare syntax
      ansible.builtin.replace:
        path: /opt/slurm-gcp-repo/ansible/playbook.yml
        regexp: "\\{\\{min_ansible_version\\}\\}"
        replace: "min_ansible_version"

    - name: Remove kernel role from slurm-gcp playbook to prevent kernel upgrades
      ansible.builtin.replace:
        path: /opt/slurm-gcp-repo/ansible/playbook.yml
        regexp: '^\s*-\s*kernel\s*$'
        replace: ''

    - name: Patch slurm-gcp ansible/playbook.yml to fix allow_erasing typo for dnf module
      ansible.builtin.replace:
        path: /opt/slurm-gcp-repo/ansible/playbook.yml
        regexp: 'allow_erasing:'
        replace: 'allowerasing:'

    - name: Patch cuda install_runfile.yml to use standard kernel-headers package name
      ansible.builtin.replace:
        path: /opt/slurm-gcp-repo/third_party/ansible/roles/cuda/tasks/install_runfile.yml
        regexp: 'kernel-headers-\{\{\s*cuda_driver_kernel_version\s*\}\}\*'
        replace: 'kernel-headers'

    # Targets slurm-gcp 6.13.1 (third_party/ansible/roles/cuda/tasks/install_runfile.yml).
    # Replaces argv list with command string so an empty use_open_drivers token is not passed to bash.
    - name: Patch cuda install_runfile.yml to avoid empty argv token when use_open_drivers is false
      ansible.builtin.replace:
        path: /opt/slurm-gcp-repo/third_party/ansible/roles/cuda/tasks/install_runfile.yml
        regexp: '(?ms)^(\s*)command:\s*\n\s*argv:\s*\n\s*-\s*bash\s*\n\s*-\s*["'']?\{\{\s*nvidia_driver_runfile\s*\}\}["'']?\s*\n\s*-\s*--silent\s*\n\s*-\s*--kernel-name\s*=\s*\{\{\s*cuda_driver_kernel_version\s*\}\}\s*\n\s*-\s*["'']?\{\{\s*[''"]-m=kernel-open[''"]\s+if\s+use_open_drivers\s+else\s+[''"]{2}\s*\}\}["'']?\s*\n\s*-\s*["'']?\{\{\s*[''"]--no-drm[''"]\s+if\s+cuda_runfile_disable_nvidia_drm\s+else\s+[''"]{2}\s*\}\}["'']?'
        replace: |
          \1command: >-
          \1  bash {{ '{{' }} nvidia_driver_runfile {{ '}}' }}
          \1  --silent
          \1  --kernel-name={{ '{{' }} cuda_driver_kernel_version {{ '}}' }}
          \1  {{ '{{' }} '-m=kernel-open' if use_open_drivers else '' {{ '}}' }}
          \1  {{ '{{' }} '--no-drm' if cuda_runfile_disable_nvidia_drm else '' {{ '}}' }}

    - name: Enable verbose logging in all roles
      ansible.builtin.shell: |
        find /opt/slurm-gcp-repo/ansible/roles -name "*.yml" -exec sed -i 's/ > \/dev\/null//g' {} +
      args:
        executable: /bin/bash

    - name: Mark nvidia-container-toolkit packages as held
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - libnvidia-container-tools
        - libnvidia-container1
        - nvidia-container-toolkit
        - nvidia-container-toolkit-base
      when: ansible_os_family == "Debian"
      ignore_errors: true

    - name: Include OS Family Dependent Vars
      ansible.builtin.include_vars: "{{ item }}"
      with_first_found:
        - files:
            - "{{ ansible_facts['distribution']|lower }}-{{ ansible_facts['distribution_version'] }}.yml"
            - "{{ ansible_facts['distribution']|lower }}-{{ ansible_facts['distribution_major_version'] }}.yml"
            - "{{ ansible_facts['distribution']|lower }}.yml"
          skip: true

    - name: Update slurm_extra_vars with OS specific variables
      ansible.builtin.set_fact:
        slurm_extra_vars: "{{ slurm_extra_vars | combine(os_slurm_extra_vars | default({})) }}"

    - name: Include TPU specific variables
      ansible.builtin.include_vars:
        file: "tpu.yml"
      when: hw_type == "tpu"

    - name: Update slurm_extra_vars with TPU specific settings
      ansible.builtin.set_fact:
        slurm_extra_vars: "{{ slurm_extra_vars | combine(tpu_slurm_vars) }}"
      when: hw_type == "tpu"

    - name: Print final slurm_extra_vars
      ansible.builtin.debug:
        var: slurm_extra_vars

    - name: Create slurm vars file
      ansible.builtin.copy:
        content: "{{ slurm_extra_vars | to_json }}"
        dest: /var/tmp/slurm_vars.json

    - name: Remove broken helm-gcp-releases repository on Ubuntu
      ansible.builtin.shell: |
        find /etc/apt/sources.list.d/ -type f -exec grep -l "helm-gcp-releases" {} + | xargs rm -f
      failed_when: false
      when: ansible_facts['distribution'] == "Ubuntu"

    - name: Remove conflicting lustre-client-modules-dkms on Ubuntu
      ansible.builtin.apt:
        name: lustre-client-modules-dkms
        state: absent
      when: ansible_facts['distribution'] == "Ubuntu"

    - name: Add Official MariaDB GPG key
      ansible.builtin.get_url:
        url: https://mariadb.org/mariadb_release_signing_key.pgp
        dest: /usr/share/keyrings/mariadb-keyring.pgp
        mode: "0644"
      when: ansible_facts['distribution'] == "Ubuntu"

    - name: Add Official MariaDB 10.11 LTS Repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64,arm64 signed-by=/usr/share/keyrings/mariadb-keyring.pgp] https://deb.mariadb.org/10.11/ubuntu {{ ansible_facts['distribution_release']
          }} main"
        state: present
        filename: mariadb
      when: ansible_facts['distribution'] == "Ubuntu"

    - name: Remove hdf5 package blocking on Ubuntu
      ansible.builtin.file:
        path: /etc/apt/preferences.d/block-hdf5
        state: absent
      when: ansible_facts['distribution'] == "Ubuntu"

    - name: Update apt cache on Ubuntu
      ansible.builtin.apt:
        update_cache: true
      when: ansible_facts['distribution'] == "Ubuntu"

    - name: Ensure EPEL repository is installed on RedHat / Rocky
      become: true
      ansible.builtin.dnf:
        name: epel-release
        state: present
      when: ansible_facts['os_family'] == "RedHat"

    - name: Install Perl build dependencies on RedHat / Rocky
      become: true
      ansible.builtin.dnf:
        name:
          - perl-Switch
          - perl-devel
        enablerepo: "{{ 'crb' if ansible_facts['distribution_major_version'] == '9' else 'powertools' }}"
        state: present
      when: ansible_facts['os_family'] == "RedHat"

    - name: Ensure GCC/autotools toolchains are available to compile TPU cli_filter
      ansible.builtin.apt:
        name:
          - autoconf
          - automake
          - libtool
          - pkg-config
          - libglib2.0-dev
          - build-essential
        state: present
      when: hw_type == "tpu" and ansible_facts['distribution'] == "Ubuntu"

    - name: Check existence of /usr/bin/ib_send_bw
      ansible.builtin.stat:
        path: /usr/bin/ib_send_bw
      register: ib_send_bw_bin
      when: ansible_facts['os_family'] == "RedHat"

    - name: Link existing perftest binary to /usr/local/bin/ib_send_bw to satisfy slurm-gcp
      become: true
      ansible.builtin.file:
        src: /usr/bin/ib_send_bw
        dest: /usr/local/bin/ib_send_bw
        state: link
        force: true
      when:
        - ansible_facts['os_family'] == "RedHat"
        - ib_send_bw_bin.stat.exists

    - name: Check existence of package manager configuration files
      ansible.builtin.stat:
        path: "{{ conf_path }}"
        follow: false
      loop:
        - /etc/dnf/dnf.conf
        - /etc/yum.conf
      loop_control:
        loop_var: conf_path
      register: pkg_mgr_confs
      when: ansible_facts['os_family'] == "RedHat"

    - name: Temporarily comment out exclude in package manager configs for slurm-gcp execution
      become: true
      ansible.builtin.replace:
        path: "{{ conf_entry.stat.path }}"
        regexp: '^(exclude\s*=.*)$'
        replace: '#SLURM_PATCH_\1'
      loop: "{{ pkg_mgr_confs.results | default([]) }}"
      loop_control:
        label: "{{ conf_entry.conf_path }}"
        loop_var: conf_entry
      when:
        - ansible_facts['os_family'] == "RedHat"
        - conf_entry.stat.exists | default(false)
        - not (conf_entry.stat.islnk | default(false))

    - name: Run the slurm-gcp ansible/playbook.yml with provided variables
      ansible.builtin.shell: |
        set -o pipefail
        ansible-playbook \
        -i localhost, \
        --connection=local \
        playbook.yml \
        -v \
        --extra-vars @/var/tmp/slurm_vars.json
      args:
        chdir: /opt/slurm-gcp-repo/ansible
        executable: /bin/bash

      environment:
        ANSIBLE_STDOUT_CALLBACK: yaml
        PYTHONUNBUFFERED: "1"

    - name: Ensure TPU topology configuration file is available for worker plugins
      ansible.builtin.copy:
        src: tpu.conf
        dest: /usr/local/etc/slurm/tpu.conf
        force: false
      when: hw_type == "tpu"

    - name: Re-apply TPU Enroot configuration (overwritten by slurm-gcp build)
      ansible.builtin.blockinfile:
        path: /etc/enroot/enroot.conf
        block: "{{ enroot_tpu_config }}"
        marker: "# {mark} ANSIBLE MANAGED TPU ENROOT PATHS"
        create: true
        mode: '0644'
      when: hw_type == "tpu"

    - name: Restore exclude in package manager configs after slurm-gcp execution
      become: true
      ansible.builtin.replace:
        path: "{{ conf_entry.stat.path }}"
        regexp: '^#SLURM_PATCH_(exclude\s*=.*)$'
        replace: '\1'
      loop: "{{ pkg_mgr_confs.results | default([]) }}"
      loop_control:
        label: "{{ conf_entry.conf_path }}"
        loop_var: conf_entry
      when:
        - ansible_facts['os_family'] == "RedHat"
        - conf_entry.stat.exists | default(false)
        - not (conf_entry.stat.islnk | default(false))

    - name: Shred static Munge key to prevent security exposure in base image
      ansible.builtin.shell: |
        if [ -f /etc/munge/munge.key ]; then
          shred --remove /etc/munge/munge.key
        fi
      ignore_errors: true
  when: install_slurm | default(false) | bool
