---
- name: Execute conditionally gated tasks natively
  block:
    - name: Include OS Family Dependent Tasks
      include_tasks: "{{ item }}"
      with_first_found:
        - os/{{ ansible_facts['distribution']|lower }}-{{ ansible_facts['distribution_version'] }}.yml
        - os/{{ ansible_facts['distribution']|lower }}-{{ ansible_facts['distribution_major_version'] }}.yml
        - os/{{ ansible_facts['distribution']|lower }}.yml
        - os/{{ ansible_facts['os_family']|lower }}-{{ ansible_facts['distribution_version'] }}.yml
        - os/{{ ansible_facts['os_family']|lower }}-{{ ansible_facts['distribution_major_version'] }}.yml
        - os/{{ ansible_facts['os_family']|lower }}.yml
  when: not (install_slurm | default(false) | bool)
