---
- name: Hold kernel packages to prevent upgrades
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - linux-image-gcp
    - linux-headers-gcp
    - linux-gcp
  become: yes

# ---------- Update Kernel and Reboot (Multi-Stage Pattern) ----------
- name: Check if Ubuntu OS preparation (pre-reboot) is complete
  ansible.builtin.stat:
    path: /etc/ubuntu_os_prep_complete
  register: ubuntu_prep_complete
  become: yes

- name: Run Ubuntu Kernel Update and Reboot
  block:
    - name: Proactively update base image to latest kernel
      ansible.builtin.apt:
        name:
          - linux-image-gcp
          - linux-headers-gcp
        state: latest
      become: yes

    - name: Create completion flag file for Ubuntu OS preparation
      ansible.builtin.file:
        path: /etc/ubuntu_os_prep_complete
        state: touch
      become: yes

    - name: Reboot to apply changes
      ansible.builtin.shell: sleep 5 && rm -rf /tmp/ansible && shutdown -r now "Rebooting after Ubuntu OS preparation"
      async: 1
      poll: 0
      ignore_errors: true
      become: yes

    # Pause execution immediately after the asynchronous reboot request.
    # This prevents Ansible from continuing to subsequent roles and corrupting
    # the dpkg state during the host's physical power-down sequence.
    - name: Wait for reboot to forcibly kill Ansible safely
      ansible.builtin.pause:
        seconds: 300

  when:
    - not ubuntu_prep_complete.stat.exists
    - update_kernel | default(true) | bool

- name: Disable automatic updates
  ansible.builtin.systemd:
    name: unattended-upgrades
    state: stopped
    enabled: false

- name: Disable AppArmor userspace restriction
  ansible.posix.sysctl:
    name: kernel.apparmor_restrict_unprivileged_userns
    value: '0'
    state: present
    sysctl_file: /etc/sysctl.d/99-apparmor-restriction.conf
    reload: yes
  when: ansible_distribution_major_version|int >= 24

- name: Enable mkhomedir PAM module for Ubuntu 24.04 and above
  block:
    - name: Check if mkhomedir is already enabled
      ansible.builtin.shell: grep -q "pam_mkhomedir.so" /etc/pam.d/common-session
      register: mkhomedir_enabled
      failed_when: false
      changed_when: false

    - name: Enable mkhomedir PAM module
      ansible.builtin.shell: pam-auth-update --enable mkhomedir
      become: yes
      environment:
        DEBIAN_FRONTEND: noninteractive
      when: mkhomedir_enabled.rc != 0
  when: ansible_distribution_major_version|int >= 24

