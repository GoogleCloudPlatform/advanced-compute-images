- name: Download CUDA keyring
  ansible.builtin.get_url:
    url: "https://developer.download.nvidia.com/compute/cuda/repos/{{ ansible_distribution | lower }}{{ ansible_distribution_major_version }}04/{{ 'sbsa' if ansible_architecture == 'aarch64' else 'x86_64' }}/cuda-keyring_1.1-1_all.deb"
    dest: "{{ nvidia_installation_path }}/cuda-keyring_1.1-1_all.deb"
    mode: '0644'
- name: Install CUDA keyring
  ansible.builtin.apt:
    deb: "{{ nvidia_installation_path }}/cuda-keyring_1.1-1_all.deb"
  become: yes
- name: Update apt cache after adding CUDA repo
  ansible.builtin.apt:
    update_cache: yes

- name: Include Architecture Specific Tasks for NCCL_GIB
  include_tasks: '{{ item }}'
  with_first_found:
  - '{{ role_path }}/tasks/arch/{{ ansible_architecture }}.yml'
  - 'arch/{{ ansible_architecture }}.yml'

- name: Ensure NCCL/gIB environment script is configured in /etc/profile.d
  ansible.builtin.copy:
    dest: /etc/profile.d/nccl_env.sh
    content: |
      # Source the official NCCL/gIB environment script
      if [ -f /usr/local/gib/scripts/set_nccl_env.sh ]; then
        . /usr/local/gib/scripts/set_nccl_env.sh
      fi
      case ":${LD_LIBRARY_PATH}:" in
        *":/usr/local/gib/lib64:"*)
          # /usr/local/gib/lib64 is already in LD_LIBRARY_PATH
          ;;
        *)
          export LD_LIBRARY_PATH="/usr/local/gib/lib64${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          ;;
      esac
    owner: root
    group: root
    mode: '0755' # Make the script executable so it's sourced by /etc/profile
  become: yes
