---
- name: Add GPG key for Lustre Client Repository
  ansible.builtin.get_url:
    url: https://us-apt.pkg.dev/doc/repo-signing-key.gpg
    dest: /etc/apt/keyrings/lustre-client.asc
    mode: '0644'
    force: true

- name: Configure Lustre Client Repository for Ubuntu/Debian
  ansible.builtin.apt_repository:
    filename: lustre-client
    repo: "deb [ signed-by=/etc/apt/keyrings/lustre-client.asc ] {{ lustre_repo_url_debian }} lustre-client-ubuntu-{{ ansible_distribution_release }} main"
    state: present
    update_cache: yes
  when: lustre_repo_url_debian is defined and lustre_repo_url_debian != ""

