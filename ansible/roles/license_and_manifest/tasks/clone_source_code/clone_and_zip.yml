- name: Check if URL is cached
  ansible.builtin.set_fact:
    cached_zip_path: "{{ mirror_url_cache[mirror.url] | default('') }}"

- name: Process uncached mirror {{ mirror.name }}
  when: cached_zip_path == ''
  block:
    - name: Create temporary directory for {{ mirror.name }}
      ansible.builtin.tempfile:
        state: directory
        suffix: "{{ mirror.name }}"
      register: temp_dir_item

    - name: Clone {{ mirror.name }}
      ansible.builtin.git:
        repo: "{{ mirror.url }}"
        dest: "{{ temp_dir_item.path }}"
        depth: 1
        clone: yes
        update: no
      register: clone_result
      ignore_errors: true

    - name: Zip {{ mirror.name }}
      ansible.builtin.archive:
        path: "{{ temp_dir_item.path }}"
        dest: "{{ source_code_mirrors_dir }}/{{ mirror.name }}.zip"
        format: zip
      when:
        - clone_result is defined
        - clone_result.changed or (clone_result | type_debug == 'dict' and clone_result.status is defined and clone_result.status == 0) # Fallback check if git module output changed
      become: true
      ignore_errors: true

    - name: Cache the mirror URL result
      ansible.builtin.set_fact:
        mirror_url_cache: "{{ mirror_url_cache | combine({mirror.url: source_code_mirrors_dir ~ '/' ~ mirror.name ~ '.zip'}) }}"
      when: clone_result is defined and (clone_result.changed or (clone_result | type_debug == 'dict' and clone_result.status is defined and clone_result.status == 0))

    - name: Clean up temporary directory for {{ mirror.name }}
      ansible.builtin.file:
        path: "{{ temp_dir_item.path }}"
        state: absent
      become: true

- name: Copy cached mirror for {{ mirror.name }}
  when: cached_zip_path != ''
  ansible.builtin.copy:
    src: "{{ cached_zip_path }}"
    dest: "{{ source_code_mirrors_dir }}/{{ mirror.name }}.zip"
    remote_src: true
  become: true
  ignore_errors: true
