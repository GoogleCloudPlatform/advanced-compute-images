- name: Ensure git and zip are installed
  ansible.builtin.package:
    name:
      - git
      - zip
    state: present
  become: true
  ignore_errors: true 

- name: Create source code mirrors directory
  ansible.builtin.file:
    path: "{{ source_code_mirrors_dir }}"
    state: directory
    mode: '0755'
  become: true

- name: Create temporary directory for cloning
  ansible.builtin.tempfile:
    state: directory
    suffix: mirrors
  register: temp_dir

- name: Initialize mirror URL cache
  ansible.builtin.set_fact:
    mirror_url_cache: {}

- name: Download and zip source code mirrors
  include_tasks: clone_and_zip.yml
  loop: "{{ source_code_mirrors }}"
  loop_control:
    loop_var: mirror

- name: Clean up temporary root directory
  ansible.builtin.file:
    path: "{{ temp_dir.path }}"
    state: absent
  become: true
