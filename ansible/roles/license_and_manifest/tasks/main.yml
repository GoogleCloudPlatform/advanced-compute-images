- name: Load Common Role Variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - files:
        - '{{ ansible_distribution|lower }}-{{ ansible_distribution_version }}.yml'
        - '{{ ansible_distribution|lower }}-{{ ansible_distribution_major_version }}.yml'
        - '{{ ansible_distribution|lower }}.yml'
        - '{{ ansible_os_family|lower }}-{{ ansible_distribution_version }}.yml'
        - '{{ ansible_os_family|lower }}-{{ ansible_distribution_major_version }}.yml'
        - '{{ ansible_os_family|lower }}.yml'
      paths:
        - "{{ playbook_dir }}/roles/common/vars"
  ignore_errors: true

- name: Load License and Manifest Role Variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - files:
        - '{{ ansible_distribution|lower }}-{{ ansible_distribution_version }}.yml'
        - '{{ ansible_distribution|lower }}-{{ ansible_distribution_major_version }}.yml'
        - '{{ ansible_distribution|lower }}.yml'
        - '{{ ansible_os_family|lower }}-{{ ansible_distribution_version }}.yml'
        - '{{ ansible_os_family|lower }}-{{ ansible_distribution_major_version }}.yml'
        - '{{ ansible_os_family|lower }}.yml'
      paths:
        - "{{ playbook_dir }}/roles/license_and_manifest/vars/os"
  ignore_errors: true

- name: Initialize manifest
  ansible.builtin.set_fact:
    manifest_lines: ""

- name: Include OS specific manifest creation tasks
  include_tasks: '{{ item }}'
  with_first_found:
    - create_manifest/os/{{ ansible_distribution|lower }}-{{ ansible_distribution_version }}.yml
    - create_manifest/os/{{ ansible_distribution|lower }}-{{ ansible_distribution_major_version }}.yml
    - create_manifest/os/{{ ansible_distribution|lower }}.yml

- name: Collect Base Image Name
  block:
    - name: Get Base Image Name from gcloud
      ansible.builtin.shell:
        cmd: "gcloud compute images describe-from-family {{ source_image_family }} --project {{ source_image_project_id }} --format='value(name)'"
      register: gcloud_image_result
      changed_when: false
      failed_when: false
      environment:
        PATH: "{{ ansible_env.PATH }}:/snap/bin"

    - name: Set Base Image Name Fact
      ansible.builtin.set_fact:
        base_image_name: "{{ gcloud_image_result.stdout | trim if gcloud_image_result.rc == 0 else 'Not Found' }}"

    - name: Get OpenSSL Version
      ansible.builtin.shell: |
        openssl version | awk '{print $2}'
      register: openssl_version_out
      changed_when: false
      failed_when: false

    - name: Get Google Cloud CLI Version
      ansible.builtin.shell: |
        if command -v gcloud > /dev/null 2>&1; then
          gcloud --version | head -n 1 | awk '{print $4}'
        else
          echo "Not Found"
        fi
      register: gcloud_cli_version_out
      changed_when: false
      failed_when: false
      environment:
        PATH: "{{ ansible_env.PATH }}:/snap/bin"


    - name: Add Base Image Name and Google Cloud CLI to Manifest
      ansible.builtin.set_fact:
        manifest_lines: |
          {{ manifest_lines }}base_image_name="{{ base_image_name }}"
          openssl="{{ (openssl_version_out | default({})).stdout | default('Not Found') | trim }}"
          google_cloud_cli="{{ (gcloud_cli_version_out | default({})).stdout | default('Not Found') | trim }}"
          google_cloud_ops_agent="{{ (ops_agent_version_out | default({})).stdout | default('Not Found') | trim }}"


- name: Collect Common Packages Versions
  when: common_packages is defined
  block:

    - name: Add Common Packages to Manifest
      ansible.builtin.set_fact:
        manifest_lines: |
          {{ manifest_lines }}{% for res in common_packages_versions.results %}
          {{ res.item }}="{{ res.stdout | trim }}"
          {% endfor %}

- name: Collect Nvidia Versions
  when: install_nvidia_stack | default(false)
  block:
    - name: Get CUDA Version
      ansible.builtin.shell: |
        if [ -x "/usr/local/cuda-{{ cuda_version.rsplit('.', 1)[0] }}/bin/nvcc" ]; then
          /usr/local/cuda-{{ cuda_version.rsplit('.', 1)[0] }}/bin/nvcc --version | grep "release" | sed 's/.*release //' | sed 's/,.*//'
        else
          echo "Not Found"
        fi
      register: cuda_version_out
      changed_when: false
      failed_when: false

    - name: Add CUDA Toolkit to Manifest
      ansible.builtin.set_fact:
        manifest_lines: |
          {{ manifest_lines }}cuda-toolkit="{{ (cuda_version_out | default({})).stdout | default('Not Found') | trim }}"

    - name: Get NVIDIA Driver Version
      ansible.builtin.shell: |
        set +x
        if command -v nvidia-smi &>/dev/null; then
          version=$(nvidia-smi --query-gpu=driver_version --format=csv,noheader | head -n1)
          if ! echo "$version" | grep -q "failed"; then
            echo "$version"
            exit 0
          fi
        fi
        if [ -f /proc/driver/nvidia/version ]; then
          awk '/NVRM version/ {print $10}' /proc/driver/nvidia/version
        else
          dpkg-query -W -f='${Version}\n' 'nvidia-kernel-common-*' 2>/dev/null | sort -V | tail -n1 || echo "Not Found"
        fi
      register: nvidia_driver_version_out
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false

    - name: Add NVIDIA Driver to Manifest
      ansible.builtin.set_fact:
        manifest_lines: |
          {{ manifest_lines }}nvidia_driver="{{ (nvidia_driver_version_out | default({})).stdout | default('Not Found') | trim }}"

    - name: Get NVIDIA Container Toolkit Packages Versions
      ansible.builtin.shell: |
        dpkg-query -W -f='${Version}\n' {{ item }} 2>/dev/null || echo "Not Found"
      loop:
        - libnvidia-container-tools
        - libnvidia-container1
        - nvidia-container-toolkit
        - nvidia-container-toolkit-base
      register: nct_packages_versions
      changed_when: false
      failed_when: false

    - name: Add NVIDIA Container Toolkit Packages to Manifest
      ansible.builtin.set_fact:
        manifest_lines: |
          {{ manifest_lines }}{% for res in nct_packages_versions.results %}
          {{ res.item }}="{{ res.stdout | trim }}"
          {% endfor %}


    - name: Get Fabric Manager Version
      ansible.builtin.shell: |
        out=$(dpkg-query -W -f='${Version}\n' 'nvidia-fabricmanager*' 2>/dev/null | sort -V | tail -n1)
        if [ -z "$out" ]; then
          echo "Not Found"
        else
          echo "$out"
        fi
      register: fabric_manager_version_out
      changed_when: false
      failed_when: false

    - name: Add Fabric Manager to Manifest
      ansible.builtin.set_fact:
        manifest_lines: |
          {{ manifest_lines }}nvidia-fabricmanager="{{ (fabric_manager_version_out | default({})).stdout | default('Not Found') | trim }}"

    - name: Get IMEX Driver Version
      ansible.builtin.shell: |
         dpkg-query -W -f='${Version}\n' 'nvidia-imex-*' 2>/dev/null | head -n1 || echo "Not Found"
      register: imex_version_out
      changed_when: false
      failed_when: false
      when: ansible_architecture == 'aarch64'

    - name: Add IMEX Driver to Manifest
      ansible.builtin.set_fact:
        manifest_lines: |
          {{ manifest_lines }}nvidia-imex="{{ (imex_version_out | default({})).stdout | default('Not Found') | trim }}"
      when: ansible_architecture == 'aarch64'

- name: Collect NCCL Versions
  when: hw_type == "gpu"
  block:
    - name: Collect NCCL Versions for Ubuntu
      when: ansible_distribution | lower == 'ubuntu'
      block:
        - name: Get NCCL Package Versions (Ubuntu)
          ansible.builtin.shell: |
            dpkg-query -W -f='${Version}\n' {{ item }} 2>/dev/null || echo "Not Found"
          loop: "{{ ['nccl-gib', 'libnccl2', 'libnccl-dev'] if ansible_architecture != 'aarch64' else ['libnccl2', 'libnccl-dev'] }}"
          register: nccl_package_versions_ubuntu
          changed_when: false
          failed_when: false

        - name: Get NCCL Version via SystemD (ARM64)
          ansible.builtin.shell: |
            if systemctl status nccl-plugin@{{ nccl_gib_version }}.service 2>&1 | grep -q "could not be found"; then
              echo "Not Found"
            else
              echo "{{ nccl_gib_version }}"
            fi
          register: nccl_gib_arm_version
          when: ansible_architecture == 'aarch64'
          changed_when: false
          failed_when: false

    - name: Collect NCCL Versions for Rocky
      when: ansible_distribution | lower == 'rocky'
      block:
        - name: Get NCCL Package Versions (Rocky)
          ansible.builtin.shell: |
            rpm -q --qf '%{VERSION}-%{RELEASE}\n' '{{ item }}' 2>/dev/null || echo "Not Found"
          loop:
            - nccl-gib
            - libnccl
            - libnccl-devel
          register: nccl_package_versions_rocky
          changed_when: false
          failed_when: false

    - name: Add NCCL Packages to Manifest
      ansible.builtin.set_fact:
        manifest_lines: |
          {{ manifest_lines }}{% if ansible_distribution | lower == 'ubuntu' %}
          {% for res in (nccl_package_versions_ubuntu | default({})).results | default([]) %}
          {{ res.item | replace('-', '_') }}="{{ res.stdout | trim if res.stdout is defined else 'Not Found' }}"
          {% endfor %}
          {% if ansible_architecture == 'aarch64' %}
          nccl_gib="{{ nccl_gib_arm_version.stdout | trim if nccl_gib_arm_version is defined and nccl_gib_arm_version.stdout is defined else 'Not Found' }}"
          {% endif %}
          {% elif ansible_distribution | lower == 'rocky' %}
          {% for res in (nccl_package_versions_rocky | default({})).results | default([]) %}
          {{ res.item | replace('-', '_') }}="{{ res.stdout | trim if res.stdout is defined else 'Not Found' }}"
          {% endfor %}
          {% endif %}

- name: Collect Docker Version
  block:
    - name: Get Docker Version
      ansible.builtin.shell: |
        if command -v docker > /dev/null 2>&1; then
          docker version --format '{{ '{{' }}.Server.Version{{ '}}' }}'
        else
          echo "Not Found"
        fi
      register: docker_version_out
      changed_when: false
      failed_when: false

    - name: Get Containerd Version
      ansible.builtin.shell: |
        if command -v containerd > /dev/null 2>&1; then
          containerd --version | awk '{print $3}'
        else
          echo "Not Found"
        fi
      register: containerd_version_out
      changed_when: false
      failed_when: false

    - name: Add Docker and Containerd to Manifest
      ansible.builtin.set_fact:
        manifest_lines: |
          {{ manifest_lines }}docker="{{ (docker_version_out | default({})).stdout | default('Not Found') | trim }}"
          containerd="{{ (containerd_version_out | default({})).stdout | default('Not Found') | trim }}"

- name: Collect GCS Fuse Version
  block:
    - name: Get GCS Fuse Version
      ansible.builtin.shell: |
        if command -v gcsfuse > /dev/null 2>&1; then
          gcsfuse --version | awk '{print $3}'
        else
          echo "Not Found"
        fi
      register: gcsfuse_version_out
      changed_when: false
      failed_when: false

    - name: Add GCS Fuse to Manifest
      ansible.builtin.set_fact:
        manifest_lines: |
          {{ manifest_lines }}gcsfuse="{{ (gcsfuse_version_out | default({})).stdout | default('Not Found') | trim }}"

- name: Collect Open MPI (OMPI) Version
  when: install_slurm | default(false)
  block:
    - name: Get Open MPI (OMPI) Version from Spack
      ansible.builtin.shell: |
        if [ -f "{{ spack_root }}/share/spack/setup-env.sh" ]; then
          . "{{ spack_root }}/share/spack/setup-env.sh"
        fi
        if command -v spack > /dev/null 2>&1; then
          spack find --format "{name} {version}" | grep "openmpi" | awk '{print $2}' || echo "Not Found"
        else
          echo "Not Found"
        fi
      register: ompi_version_out
      changed_when: false
      failed_when: false

    - name: Add OpenMPI to Manifest
      ansible.builtin.set_fact:
        manifest_lines: |
          {{ manifest_lines }}ompi="{{ (ompi_version_out.stdout | default('Not Found')) | trim }}"

- name: Collect Lmod Version
  block:
    - name: Get Lmod Version from Spack
      ansible.builtin.shell: |
        if [ -f "{{ spack_root }}/share/spack/setup-env.sh" ]; then
          . "{{ spack_root }}/share/spack/setup-env.sh"
        fi
        if command -v spack > /dev/null 2>&1; then
          spack find --format "{name} {version}" | grep "lmod" | awk '{print $2}' || echo "Not Found"
        else
          echo "Not Found"
        fi
      register: lmod_version_out
      changed_when: false
      failed_when: false

    - name: Add Lmod to Manifest
      ansible.builtin.set_fact:
        manifest_lines: |
          {{ manifest_lines }}lmod="{{ (lmod_version_out | default({})).stdout | default('Not Found') | trim }}"

- name: Collect Slurm Version
  when: install_slurm | default(false)
  block:
    - name: Get Slurm Version
      ansible.builtin.shell: |
        if command -v slurmctld > /dev/null 2>&1; then
          slurmctld --version | awk '{print $2}'
        else
          echo "Not Found"
        fi
      register: slurm_version_out
      changed_when: false
      failed_when: false


    - name: Get Pyxis Version from Source
      ansible.builtin.shell: |
        cat /opt/slurm-gcp-repo/ansible/roles/pyxis/defaults/main.yml | grep "pyxis_ver:" | awk '{print $2}' || echo "Not Found"
      register: pyxis_src_version_out
      changed_when: false
      failed_when: false

    - name: Add Slurm to Manifest
      ansible.builtin.set_fact:
        manifest_lines: |
          {{ manifest_lines }}slurm="{{ (slurm_version_out | default({})).stdout | default('Not Found') | trim }}"
          pyxis="{{ (pyxis_src_version_out | default({})).stdout | default('Not Found') | trim }}"
          {% for res in slurm_dep_versions.results %}
          {{ res.item }}="{{ res.stdout | trim }}"
          {% endfor %}

- name: Collect RDMA Core Version
  when: hw_type == "cpu"
  block:
    - name: Get RDMA Core Version
      ansible.builtin.shell: "rpm -q --qf '%{VERSION}-%{RELEASE}\n' rdma-core 2>/dev/null || echo 'Not Found'"
      register: rdma_core_version_out
      changed_when: false
      failed_when: false

    - name: Add RDMA Core to Manifest
      ansible.builtin.set_fact:
        manifest_lines: |
          {{ manifest_lines }}rdma-core="{{ (rdma_core_version_out | default({})).stdout | default('Not Found') | trim }}"

- name: Collect Lustre Version
  when:
    - install_slurm or install_lustre
  block:
    - name: Get Lustre Version
      ansible.builtin.shell: |
        if command -v dpkg > /dev/null 2>&1; then
          dpkg-query -W -f='${Version}' lustre-client-utils 2>/dev/null || echo "Not Found"
        elif command -v rpm > /dev/null 2>&1; then
          rpm -q --queryformat '%{VERSION}' lustre-client 2>/dev/null || echo "Not Found"
        else
          echo "Not Found"
        fi
      register: lustre_version_out
      changed_when: false
      failed_when: false

    - name: Add Lustre to Manifest
      ansible.builtin.set_fact:
        manifest_lines: |
          {{ manifest_lines }}lustre-client-utils="{{ (lustre_version_out | default({})).stdout | default('Not Found') | trim }}"

- name: Collect Spack Version
  block:
    - name: Get Spack Version
      ansible.builtin.shell: |
        if [ -f "{{ spack_root }}/share/spack/setup-env.sh" ]; then
          . "{{ spack_root }}/share/spack/setup-env.sh"
        fi
        if command -v spack > /dev/null 2>&1; then
          spack --version
        else
          echo "Not Found"
        fi
      register: spack_version_out
      changed_when: false
      failed_when: false

    - name: Add Spack to Manifest
      ansible.builtin.set_fact:
        manifest_lines: |
          {{ manifest_lines }}spack="{{ (spack_version_out | default({})).stdout | default('Not Found') | trim }}"

- name: Debug Manifest Content
  ansible.builtin.debug:
    var: manifest_lines

- name: Ensure manifest directory exists
  ansible.builtin.file:
    path: "{{ output_file | dirname }}"
    state: directory
    mode: '0755'
  become: true

- name: Write manifest content to file
  ansible.builtin.copy:
    dest: "{{ output_file }}"
    content: "{{ manifest_lines | trim }}\n"
    mode: '0644'
  become: true

- name: Create symlink to manifest file
  ansible.builtin.file:
    src: "{{ output_file }}"
    dest: /etc/package-manifest
    state: link
  become: true

- name: Set welcome message in /etc/motd
  ansible.builtin.copy:
    dest: /etc/motd
    content: |
      Welcome to the Google Cloud ACI Image
      For the manifest of all packages and versions, please see /etc/package-manifest
    mode: '0644'
  become: true

- name: Include Source Code Mirrors tasks
  include_tasks: 'clone_source_code/source_code_mirrors.yml'

- name: Include OS specific role for generating licenses
  include_tasks: '{{ item }}'
  with_first_found:
  - generate_license/os/{{ ansible_distribution|lower }}-{{ ansible_distribution_version }}.yml
  - generate_license/os/{{ ansible_distribution|lower }}-{{ ansible_distribution_major_version }}.yml
  - generate_license/os/{{ ansible_distribution|lower }}.yml