- name: Get Google Cloud Ops Agent Version (Debian)
  ansible.builtin.shell: |
    dpkg-query -W -f='${Version}\n' google-cloud-ops-agent 2>/dev/null || echo "Not Found"
  register: ops_agent_version_out
  changed_when: false
  failed_when: false

- name: Get Common Package Versions (Debian)
  ansible.builtin.shell: |
    dpkg-query -W -f='${Version}\n' {{ item }} 2>/dev/null || echo "Not Found"
  loop: "{{ common_packages }}"
  register: common_packages_versions
  when: common_packages is defined
  changed_when: false
  failed_when: false

- name: Get Slurm Dependency Versions (Debian)
  ansible.builtin.shell: |
    dpkg-query -W -f='${Version}\n' {{ item }} 2>/dev/null || echo "Not Found"
  loop:
    - libjwt-dev
    - libmariadb-dev
    - mariadb-server
    - munge
    - nfs-kernel-server
    - pdsh
    - tmux
    - valgrind
    - vim
  register: slurm_dep_versions
  when: install_slurm | default(false)
  changed_when: false
  failed_when: false
