build_slurm_from_git_ref: 6.12.1
slurm_repo_dest: "/opt/slurm-gcp-repo"
# Variables to pass to the inner ansible-playbook
slurm_extra_vars:
  reboot: false
  install_cuda: false
  install_gcsfuse: true
  install_lustre: false
  install_managed_lustre: true
  install_ompi: "{{ ansible_architecture == 'aarch64' }}"
  allow_kernel_upgrades: false
  monitoring_agent: "cloud-ops"