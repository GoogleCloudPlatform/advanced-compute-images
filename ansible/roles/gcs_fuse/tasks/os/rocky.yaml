- name: Configure GCSFuse YUM repository for Rocky Linux 9
  ansible.builtin.yum_repository:
    name: gcsfuse
    description: "Cloud Storage FUSE (Rocky Linux 9)"
    baseurl: "https://packages.cloud.google.com/yum/repos/gcsfuse-el7-$basearch"
    enabled: yes
    gpgcheck: yes
    repo_gpgcheck: yes
    gpgkey:
      - "https://packages.cloud.google.com/yum/doc/yum-key.gpg"
      - "https://packages.cloud.google.com/yum/doc/rpm-package-key.gpg"
    state: present
  register: gcsfuse_repo_config


- name: Install gcsfuse package
  ansible.builtin.yum:
    name: gcsfuse
    state: latest
    # Update cache if the repo was newly added or changed
    update_cache: yes
  when: gcsfuse_repo_config is not failed