---
# Tasks for installing Google HPC specifics, which are to be
# executed after the first reboot.

- name: Configure Console (After Reboot)
  block:
    - name: Enable ttyS1 console
      ansible.builtin.systemd:
        name: serial-getty@ttyS1.service
        enabled: yes
    - name: Disable ttyS0 console
      ansible.builtin.systemd:
        name: serial-getty@ttyS0.service
        enabled: no

# Local Build Flow: Build RPM locally and install
- name: Install Google HPC RPMs (Local Build Flow)
  block:
    - name: Include RPM build tasks
      include_tasks: os/build_rpm.yml

    - name: Install locally built RPM
      ansible.builtin.dnf:
        name: "{{ local_built_rpm_path }}"
        state: present
        disable_gpg_check: yes

    - name: Clean up rpmbuild directory
      ansible.builtin.file:
        path: "{{ rpmbuild_dir }}"
        state: absent

- name: Run Google MPI Tuning (Post-Install)
  ansible.builtin.command:
    cmd: /usr/bin/google_mpi_tuning --nofirewalld --noselinux
  register: tuning_result
  changed_when: "'No task(s) selected' not in tuning_result.stderr"

- name: Cleanup Image
  block:
    - name: Reset machine-id
      ansible.builtin.copy:
        dest: /etc/machine-id
        content: "uninitialized\n"

    - name: Remove Logs
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/log/dmesg
        - /var/log/dmesg.old
        - /var/log/tuned
        - /var/cache/yum
        - /root/.bash_history

    - name: Truncate Logs
      ansible.builtin.shell: truncate -s 0 {{ item }}
      loop:
        - /var/log/boot.log
        - /var/log/audit/audit.log
        - /var/log/lastlog
        - /var/log/maillog
        - /var/log/firewalld
        - /var/log/secure
        - /var/log/wtmp
        - /var/log/messages
      ignore_errors: yes

    - name: Touch firstrun flag
      ansible.builtin.file:
        path: /.google_hpc_firstrun
        state: touch

    - name: Yum Autoremove
      ansible.builtin.dnf:
        autoremove: yes

    - name: Yum Clean All
      ansible.builtin.command: yum clean all

    - name: Clear Journal
      ansible.builtin.command: journalctl --flush --vacuum-time=1s

    - name: Shred SSH Host Keys
      ansible.builtin.shell: shred --remove /etc/ssh/ssh_host_*
      ignore_errors: yes

    - name: Clear History
      ansible.builtin.shell: '> /root/.bash_history'