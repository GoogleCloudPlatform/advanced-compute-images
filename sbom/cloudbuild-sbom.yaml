# This Cloud Build generates an SBOM and uploads it to a temporary GCS location.
substitutions:
  _SOURCE_IMAGE: ""
  _ZONE: "us-central1-a"
  _BUILD_ID: ""
  _SBOM_GCS_PATH: "" # Used for temporary storage of SBOM
  _MACHINE_TYPE: "" # Optional override for GCE machine type

steps:
- name: 'gcr.io/google.com/cloudsdktool/google-cloud-cli:slim'
  entrypoint: 'bash'
  env:
    - 'PACKER_LOG=1'
  args:
    - '-c'
    - |
      set -e
      echo "Starting SBOM generation for image: ${_SOURCE_IMAGE}"

      # Install dependencies
      echo "Installing dependencies..."
      apt-get update && apt-get install -y unzip curl coreutils

      # Install Packer with SHA-256 checksum verification
      echo "Installing Packer..."
      PACKER_VERSION="1.11.2"
      PACKER_SHA256="ced13efc257d0255932d14b8ae8f38863265133739a007c430cae106afcfc45a"
      curl -sSL -O "https://releases.hashicorp.com/packer/$${PACKER_VERSION}/packer_$${PACKER_VERSION}_linux_amd64.zip"
      echo "$${PACKER_SHA256}  packer_$${PACKER_VERSION}_linux_amd64.zip" | sha256sum -c -
      unzip -j -o "packer_$${PACKER_VERSION}_linux_amd64.zip" packer -d /usr/bin
      chmod +x /usr/bin/packer
      rm "packer_$${PACKER_VERSION}_linux_amd64.zip"
      packer --version

      BUILD_ID_VAL="${_BUILD_ID}"
      if [[ -z "$$BUILD_ID_VAL" ]]; then
        BUILD_ID_VAL="${BUILD_ID}"
      fi
      if [[ -z "$$BUILD_ID_VAL" ]]; then
        BUILD_ID_VAL="$$(date +%s)"
      fi

      SBOM_GCS_PATH_VAL="${_SBOM_GCS_PATH}"
      if [[ -z "$$SBOM_GCS_PATH_VAL" ]]; then
        SBOM_GCS_PATH_VAL="gs://${PROJECT_ID}-exports/sboms/${_SOURCE_IMAGE}/$${BUILD_ID_VAL}/sbom.spdx.json"
      fi
      echo "SBOM will be uploaded to: $${SBOM_GCS_PATH_VAL}"

      ZONE="${_ZONE}"
      declare -a PACKER_ARGS
      PACKER_ARGS+=(-var="project_id=${PROJECT_ID}")
      PACKER_ARGS+=(-var="source_image=${_SOURCE_IMAGE}")
      PACKER_ARGS+=(-var="sbom_gcs_path=$${SBOM_GCS_PATH_VAL}")
      PACKER_ARGS+=(-var="build_id=$${BUILD_ID_VAL}")

      if [[ -n "${_MACHINE_TYPE}" ]]; then
        echo "Explicit machine_type requested: ${_MACHINE_TYPE}"
        PACKER_ARGS+=(-var="machine_type=${_MACHINE_TYPE}")
      elif [[ "${_SOURCE_IMAGE}" =~ -arm64- || "${_SOURCE_IMAGE}" =~ -arm- || "${_SOURCE_IMAGE}" =~ arm64 ]]; then
        echo "ARM64 image detected (${_SOURCE_IMAGE}), selecting ARM64 instance type t2a-standard-4."
        PACKER_ARGS+=(-var="machine_type=t2a-standard-4")
        if [[ "$${ZONE}" == "us-central1-c" ]]; then
          echo "Zone $${ZONE} does not support Tau T2A ARM64 instances. Switching to us-central1-a."
          ZONE="us-central1-a"
        fi
      fi
      PACKER_ARGS+=(-var="zone=$${ZONE}")
      PACKER_ARGS+=(sbom/)

      echo "Running Packer build with args: $${PACKER_ARGS[@]}"
      packer init sbom/
      packer build "$${PACKER_ARGS[@]}"
      echo "Packer build complete."
timeout: '1800s'
options:
  logging: CLOUD_LOGGING_ONLY