# This Cloud Build generates an SBOM and uploads it to a temporary GCS location.
substitutions:
  _SOURCE_IMAGE: ""
  _ZONE: "us-central1-a"
  _BUILD_ID: ""
  _SBOM_GCS_PATH: "" # Used for temporary storage of SBOM
  _MACHINE_TYPE: "" # Optional override for GCE machine type

steps:
- name: 'gcr.io/google.com/cloudsdktool/google-cloud-cli:slim'
  entrypoint: 'bash'
  env:
    - 'PACKER_LOG=1'
  args:
    - '-c'
    - |
      set -e
      echo "Starting SBOM generation for image: ${_SOURCE_IMAGE}"
      echo "SBOM will be uploaded to: ${_SBOM_GCS_PATH}"

      # Install Packer
      echo "Installing dependencies..."
      apt-get update && apt-get install -y unzip

      echo "Installing Packer..."
      PACKER_VERSION="1.11.2"
      curl -LO "https://releases.hashicorp.com/packer/$${PACKER_VERSION}/packer_$${PACKER_VERSION}_linux_amd64.zip"
      unzip -j -o "packer_$${PACKER_VERSION}_linux_amd64.zip" packer -d /usr/bin
      chmod +x /usr/bin/packer
      rm "packer_$${PACKER_VERSION}_linux_amd64.zip"
      ZONE="${_ZONE}"
      declare -a PACKER_ARGS
      PACKER_ARGS+=(-var="project_id=${PROJECT_ID}")
      PACKER_ARGS+=(-var="source_image=${_SOURCE_IMAGE}")
      PACKER_ARGS+=(-var="sbom_gcs_path=${_SBOM_GCS_PATH}")
      PACKER_ARGS+=(-var="build_id=${_BUILD_ID}")

      if [[ -n "${_MACHINE_TYPE}" ]]; then
        echo "Explicit machine_type requested: ${_MACHINE_TYPE}"
        PACKER_ARGS+=(-var="machine_type=${_MACHINE_TYPE}")
      elif [[ "${_SOURCE_IMAGE}" =~ -arm64- || "${_SOURCE_IMAGE}" =~ -arm- || "${_SOURCE_IMAGE}" =~ arm64 ]]; then
        echo "ARM64 image detected (${_SOURCE_IMAGE}), selecting ARM64 instance type t2a-standard-4."
        PACKER_ARGS+=(-var="machine_type=t2a-standard-4")
        if [[ "$${ZONE}" == "us-central1-c" ]]; then
          echo "Zone $${ZONE} does not support Tau T2A ARM64 instances. Switching to us-central1-a."
          ZONE="us-central1-a"
        fi
      fi
      PACKER_ARGS+=(-var="zone=$${ZONE}")
      PACKER_ARGS+=(sbom/)

      echo "Running Packer build with args: ${PACKER_ARGS[@]}"
      packer init sbom/
      packer build "${PACKER_ARGS[@]}"
      echo "Packer build complete."
timeout: '1800s'
options:
  logging: CLOUD_LOGGING_ONLY